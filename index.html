<style>
/* ===========================================================
   FALA SINUCA — estilos
   =========================================================== */
:root {
  --feltro:      #0d2818;
  --feltro-alto: #12351f;
  --fundo:       #0a1410;
  --painel:      #11201a;
  --painel-alto: #172b22;
  --borda:       #1e3a2c;
  --borda-forte: #2b5440;
  --texto:       #e8f0ea;
  --texto-fraco: #8fa89a;
  --ouro:        #d4a03c;
  --ouro-claro:  #f0c675;
  --verde:       #3fb950;
  --vermelho:    #e5484d;
  --azul:        #4493f8;
  --laranja:     #d29922;
  --raio:        14px;
  --sombra:      0 8px 28px rgba(0,0,0,.45);
  --fonte: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { background: var(--fundo); }
body {
  background: radial-gradient(1200px 700px at 50% -12%, var(--feltro) 0%, var(--fundo) 62%) no-repeat;
  background-color: var(--fundo);
  color: var(--texto);
  font-family: var(--fonte);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--ouro-claro); }
[hidden] { display: none !important; }

/* ---------- Layout ---------- */
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 96px; }

.topo {
  position: sticky; top: 0; z-index: 40;
  background: rgba(10,20,16,.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--borda);
}
.topo-in {
  max-width: 1120px; margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.marca { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .5px; }
.marca .bola {
  width: 30px; height: 30px; border-radius: 50%; flex: 0 0 30px;
  background: radial-gradient(circle at 32% 30%, #fff 0 12%, var(--ouro) 13% 100%);
  box-shadow: inset -3px -4px 8px rgba(0,0,0,.45);
  display: grid; place-items: center; font-size: 13px; color: #3a2a08; font-weight: 900;
}
.marca-txt { font-size: 15px; }
.marca-txt small { display: block; font-size: 10px; font-weight: 600; color: var(--texto-fraco); letter-spacing: 1.4px; }
.topo-dir { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.eu {
  display: flex; align-items: center; gap: 9px;
  background: var(--painel-alto); border: 1px solid var(--borda-forte);
  border-radius: 999px; padding: 5px 6px 5px 12px;
}
.eu b { font-size: 14px; }
.eu .moedas { color: var(--ouro-claro); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }

/* ---------- Navegação ---------- */
.nav {
  display: flex; gap: 4px; overflow-x: auto; padding: 8px 0 0;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav button {
  background: transparent; border: 0; border-bottom: 2px solid transparent;
  color: var(--texto-fraco); padding: 9px 14px; white-space: nowrap;
  font-weight: 600; font-size: 14px; border-radius: 8px 8px 0 0;
}
.nav button:hover { color: var(--texto); background: rgba(255,255,255,.03); }
.nav button.on { color: var(--ouro-claro); border-bottom-color: var(--ouro); }
.nav .adm.on { color: #ff9ea1; border-bottom-color: var(--vermelho); }

/* ---------- Blocos ---------- */
.card {
  background: var(--painel); border: 1px solid var(--borda);
  border-radius: var(--raio); padding: 18px; margin: 16px 0;
}
.card > h2 { margin: 0 0 4px; font-size: 17px; }
.card > h2 + p.sub { margin: 0 0 16px; color: var(--texto-fraco); font-size: 13px; }
h3 { font-size: 14px; margin: 22px 0 10px; color: var(--texto-fraco);
     text-transform: uppercase; letter-spacing: 1.1px; }
.grade { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); }
.linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Tabelas ---------- */
.tab-rolagem { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  text-align: left; padding: 9px 10px; font-size: 11px; font-weight: 700;
  color: var(--texto-fraco); text-transform: uppercase; letter-spacing: .9px;
  border-bottom: 1px solid var(--borda); white-space: nowrap;
}
td { padding: 11px 10px; border-bottom: 1px solid rgba(30,58,44,.55); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: rgba(255,255,255,.022); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.destaque td { background: rgba(212,160,60,.07); }

.pos {
  display: inline-grid; place-items: center; width: 27px; height: 27px;
  border-radius: 8px; background: var(--painel-alto); border: 1px solid var(--borda-forte);
  font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums;
}
.pos.p1 { background: linear-gradient(150deg,#d4a03c,#9c6f16); color:#20160a; border-color:#e5bb63; }
.pos.p2 { background: linear-gradient(150deg,#c7ccd1,#8b9299); color:#1a1d20; border-color:#dfe3e6; }
.pos.p3 { background: linear-gradient(150deg,#c98a52,#8a5a2c); color:#241407; border-color:#dda471; }

.jog { display: flex; align-items: center; gap: 9px; }
.jog .em { font-size: 17px; line-height: 1; }
.jog b { font-weight: 650; }

/* ---------- Etiquetas ---------- */
.tag {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .3px; white-space: nowrap;
  border: 1px solid transparent;
}
.t-verde    { background: rgba(63,185,80,.14);  color: #7ee08a; border-color: rgba(63,185,80,.3); }
.t-vermelho { background: rgba(229,72,77,.14);  color: #ff9296; border-color: rgba(229,72,77,.3); }
.t-ouro     { background: rgba(212,160,60,.14); color: var(--ouro-claro); border-color: rgba(212,160,60,.32); }
.t-azul     { background: rgba(68,147,248,.14); color: #8dc0ff; border-color: rgba(68,147,248,.3); }
.t-cinza    { background: rgba(143,168,154,.12); color: var(--texto-fraco); border-color: var(--borda-forte); }

.forma { display: inline-flex; gap: 3px; }
.forma i {
  width: 17px; height: 17px; border-radius: 5px; display: grid; place-items: center;
  font-size: 10px; font-weight: 800; font-style: normal;
}
.forma .V { background: rgba(63,185,80,.22);  color: #7ee08a; }
.forma .E { background: rgba(143,168,154,.18); color: var(--texto-fraco); }
.forma .D { background: rgba(229,72,77,.2);   color: #ff9296; }

/* ---------- Botões ---------- */
.btn {
  background: var(--painel-alto); border: 1px solid var(--borda-forte);
  color: var(--texto); border-radius: 10px; padding: 9px 16px;
  font-weight: 650; font-size: 14px; transition: .13s;
}
.btn:hover:not(:disabled) { background: #1e3529; border-color: #35674e; }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.p { background: linear-gradient(160deg,#d4a03c,#a97a1f); border-color:#e5bb63; color:#1e1405; }
.btn.p:hover:not(:disabled) { background: linear-gradient(160deg,#e5b355,#bb8a28); }
.btn.ok { background: rgba(63,185,80,.16); border-color: rgba(63,185,80,.45); color: #8ce89a; }
.btn.ok:hover:not(:disabled) { background: rgba(63,185,80,.26); }
.btn.perigo { background: rgba(229,72,77,.14); border-color: rgba(229,72,77,.42); color:#ff9296; }
.btn.perigo:hover:not(:disabled) { background: rgba(229,72,77,.24); }
.btn.mini { padding: 5px 11px; font-size: 12.5px; border-radius: 8px; }

label.campo { display: block; margin-bottom: 12px; }
label.campo > span, .campo > .rot {
  display: block; font-size: 11.5px; font-weight: 700; color: var(--texto-fraco);
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px;
}
input, select, textarea {
  width: 100%; background: var(--fundo); border: 1px solid var(--borda-forte);
  border-radius: 10px; padding: 10px 12px; outline: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--ouro); }

/* ---------- Fala Score ---------- */
.score-caixa { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.aro { position: relative; width: 112px; height: 112px; flex: 0 0 112px; }
.aro svg { transform: rotate(-90deg); display: block; }
.aro .valor {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
}
.aro .valor b { font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.aro .valor small { display:block; font-size: 9px; color: var(--texto-fraco);
                    letter-spacing: 1.3px; text-transform: uppercase; margin-top: 3px; }
.comp { margin: 9px 0; }
.comp-topo { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
.comp-topo span:last-child { color: var(--texto-fraco); font-variant-numeric: tabular-nums; }
.barra { height: 6px; background: var(--fundo); border-radius: 99px; overflow: hidden; }
.barra i { display: block; height: 100%; border-radius: 99px; background: var(--ouro); }

.mini-score {
  display: inline-flex; align-items: center; gap: 6px;
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
}
.mini-score .pip { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }

/* ---------- Cinturão ---------- */
.cinturao {
  display: flex; align-items: center; gap: 16px; margin: 16px 0;
  background: linear-gradient(110deg, rgba(212,160,60,.20) 0%, rgba(212,160,60,.06) 48%, transparent 100%);
  border: 1px solid rgba(212,160,60,.45); border-radius: var(--raio);
  padding: 16px 20px; position: relative; overflow: hidden;
}
.cinturao::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(420px 130px at 8% 50%, rgba(240,198,117,.14), transparent 70%);
  pointer-events: none;
}
.cint-ico {
  font-size: 34px; line-height: 1; flex: 0 0 auto;
  filter: drop-shadow(0 3px 10px rgba(212,160,60,.55));
}
.cint-txt { display: grid; gap: 1px; z-index: 1; }
.cint-txt span {
  font-size: 10px; font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase; color: var(--ouro);
}
.cint-txt b { font-size: 23px; font-weight: 800; color: var(--ouro-claro); line-height: 1.2; }
.cint-txt small { font-size: 12px; color: var(--texto-fraco); }
.cint-voce {
  margin-left: auto; z-index: 1; white-space: nowrap;
  background: var(--ouro); color: #20160a; font-weight: 800; font-size: 11px;
  letter-spacing: 1px; text-transform: uppercase; padding: 5px 12px; border-radius: 999px;
}
.cint {
  color: var(--ouro-claro); font-weight: 700; letter-spacing: .2px;
  white-space: nowrap; margin-left: 2px;
}
tr.linha-campea td { background: rgba(212,160,60,.08); }
tr.linha-campea td:first-child { box-shadow: inset 3px 0 0 var(--ouro); }

.kpi {
  background: var(--painel-alto); border: 1px solid var(--borda);
  border-radius: 11px; padding: 13px 15px;
}
.kpi span { display: block; font-size: 11px; color: var(--texto-fraco);
            text-transform: uppercase; letter-spacing: .9px; }
.kpi b { display: block; font-size: 22px; font-weight: 800; margin-top: 3px;
         font-variant-numeric: tabular-nums; }

/* ---------- Tela de entrada ---------- */
.entrada { max-width: 620px; margin: 8vh auto; padding: 0 16px; text-align: center; }
.entrada .bola-g {
  width: 74px; height: 74px; border-radius: 50%; margin: 0 auto 18px;
  background: radial-gradient(circle at 32% 28%, #fff 0 11%, var(--ouro) 12% 100%);
  box-shadow: inset -6px -8px 16px rgba(0,0,0,.5), 0 10px 34px rgba(212,160,60,.22);
  display: grid; place-items: center; font-size: 28px; font-weight: 900; color: #3a2a08;
}
.entrada h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -.4px; }
.entrada p { color: var(--texto-fraco); margin: 0 0 26px; }
.escolha { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px,1fr)); gap: 9px; }
.escolha button {
  background: var(--painel); border: 1px solid var(--borda);
  border-radius: 12px; padding: 15px 8px; display: grid; gap: 6px; justify-items: center;
  transition: .13s;
}
.escolha button:hover { border-color: var(--ouro); background: var(--painel-alto); transform: translateY(-2px); }
.escolha .e { font-size: 25px; line-height: 1; }
.escolha .n { font-weight: 650; font-size: 13.5px; }
.escolha .p { font-size: 11px; color: var(--texto-fraco); }

/* ---------- Modal ---------- */
.fundo-modal {
  position: fixed; inset: 0; background: rgba(4,9,7,.78); backdrop-filter: blur(4px);
  display: grid; place-items: center; padding: 16px; z-index: 100;
}
.modal {
  background: var(--painel); border: 1px solid var(--borda-forte); border-radius: 16px;
  padding: 22px; width: 100%; max-width: 440px; box-shadow: var(--sombra);
  max-height: 88vh; overflow-y: auto;
}
.modal h3 { margin: 0 0 14px; font-size: 17px; color: var(--texto);
            text-transform: none; letter-spacing: 0; }

/* ---------- Avisos ---------- */
.aviso {
  border-radius: 11px; padding: 12px 15px; font-size: 13.5px; margin: 12px 0;
  border: 1px solid; display: flex; gap: 10px; align-items: flex-start;
}
.aviso.info    { background: rgba(68,147,248,.08); border-color: rgba(68,147,248,.3); }
.aviso.alerta  { background: rgba(210,153,34,.08); border-color: rgba(210,153,34,.32); }
.aviso.erro    { background: rgba(229,72,77,.09);  border-color: rgba(229,72,77,.34); }
.aviso.bom     { background: rgba(63,185,80,.08);  border-color: rgba(63,185,80,.3); }

.toast-area { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
              z-index: 200; display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); }
.toast {
  background: var(--painel-alto); border: 1px solid var(--borda-forte);
  border-radius: 11px; padding: 12px 16px; box-shadow: var(--sombra);
  font-size: 14px; animation: sobe .22s ease;
}
.toast.erro { border-color: rgba(229,72,77,.5); background: #2a1517; }
.toast.bom  { border-color: rgba(63,185,80,.45); background: #122a18; }
@keyframes sobe { from { opacity: 0; transform: translateY(10px); } }

.vazio { text-align: center; padding: 34px 16px; color: var(--texto-fraco); }
.vazio .ic { font-size: 32px; display: block; margin-bottom: 8px; opacity: .55; }

.spark { display: block; width: 100%; height: 64px; }
.h2h-barra { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--fundo); }
.h2h-barra i { display: block; height: 100%; }

.rodape { text-align: center; color: var(--texto-fraco); font-size: 12px; padding: 26px 0 0; }

@media (max-width: 620px) {
  .card { padding: 14px; }
  .tab-rolagem { margin: 0 -14px; padding: 0 14px; }
  .esconde-mob { display: none; }
  .entrada { margin-top: 4vh; }
  table { font-size: 13.5px; }
  th { padding: 8px 5px; font-size: 10px; letter-spacing: .5px; }
  td { padding: 9px 5px; }
  .kpi { padding: 10px 12px; }
  .kpi b { font-size: 18px; }
  .jog { gap: 6px; }
  .jog .em { font-size: 15px; }
  .aro { width: 92px; height: 92px; flex: 0 0 92px; }
  .aro svg { width: 92px; height: 92px; }
  .aro .valor b { font-size: 25px; }
  .cinturao { padding: 13px 15px; gap: 12px; }
  .cint-ico { font-size: 27px; }
  .cint-txt b { font-size: 18px; }
  .cint-voce { padding: 4px 9px; font-size: 10px; }
}

/* ---------- Avatar e personalização ---------- */
.av {
  border-radius: 50%; object-fit: cover; display: block; flex: 0 0 auto;
  border: 1px solid var(--borda-forte); background: var(--painel-alto);
}
.jog .av { border-color: rgba(212,160,60,.3); }
.cint-txt .av { display: inline-block; vertical-align: -6px; }
.escolha .av { margin: 0 auto; }

.emoji-grade {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px;
  max-height: 168px; overflow-y: auto; padding: 2px;
}
.emoji-grade button {
  background: var(--fundo); border: 1px solid var(--borda);
  border-radius: 9px; padding: 6px 0; font-size: 19px; line-height: 1.2; transition: .12s;
}
.emoji-grade button:hover { border-color: var(--ouro); background: var(--painel-alto); }
.emoji-grade button.on { border-color: var(--ouro); background: rgba(212,160,60,.18); }

div.campo { display: block; margin-bottom: 12px; }

/* ---------- Gerador do confra ---------- */
.presentes { display: flex; flex-wrap: wrap; gap: 7px; }
.presentes label {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  background: var(--fundo); border: 1px solid var(--borda);
  border-radius: 999px; padding: 6px 13px 6px 10px; font-size: 13.5px; transition: .12s;
}
.presentes label:hover { border-color: var(--borda-forte); }
.presentes label.on { border-color: var(--ouro); background: rgba(212,160,60,.14); }
.presentes label input { width: auto; margin: 0; accent-color: var(--ouro); }
.presentes .p { color: var(--texto-fraco); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.rodada { border: 1px solid var(--borda); border-radius: 11px; padding: 12px; margin-top: 11px; }
.rodada-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
.confronto {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 0; border-top: 1px solid rgba(30,58,44,.6);
}
.cf-nomes { font-size: 14.5px; }
.cf-info { margin-left: auto; color: var(--texto-fraco); font-size: 12px; font-variant-numeric: tabular-nums; }
@media (max-width: 620px) { .cf-info { margin-left: 0; width: 100%; } }
.rodada-cint {
  border-color: rgba(212,160,60,.45);
  background: linear-gradient(180deg, rgba(212,160,60,.07), transparent 60%);
}
.confronto { cursor: pointer; }
.confronto input.cf-ok { width: auto; margin: 0; accent-color: var(--ouro); flex: 0 0 auto; }
.confronto.recusada { opacity: .4; }
.confronto.recusada .cf-nomes { text-decoration: line-through; }

</style>
</head>
<body>

<!-- ===================== TELA DE ENTRADA ===================== -->
<div id="tela-entrada" class="entrada">
  <div class="bola-g">8</div>
  <h1>Fala Sinuca</h1>
  <p id="entrada-sub">Carregando…</p>
  <div id="lista-jogadores" class="escolha"></div>
  <div id="entrada-erro"></div>
  <p style="margin-top:26px">
    <button class="btn mini" id="btn-login-admin">Entrar como administrador</button>
  </p>
</div>

<!-- ===================== APP ===================== -->
<div id="app" hidden>
  <header class="topo">
    <div class="topo-in">
      <div class="marca">
        <div class="bola">8</div>
        <div class="marca-txt">Fala Sinuca<small id="temporada">TEMPORADA</small></div>
      </div>
      <div class="topo-dir">
        <div class="eu" id="caixa-eu"></div>
        <button class="btn mini" id="btn-trocar">Trocar</button>
      </div>
    </div>
    <div class="topo-in" style="padding-top:0;padding-bottom:0">
      <nav class="nav" id="nav"></nav>

  <main class="wrap" id="conteudo"></main>

  <p class="rodape">Fala Sinuca · <span id="rodape-info"></span></p>
</div>

<div class="toast-area" id="toasts"></div>
<div id="modais"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== MOTOR DE CALCULO ===== */
/* ============================================================
   FALA SINUCA — MOTOR DE CÁLCULO
   Réplica exata das fórmulas da planilha Fala_Sinuca_Ranking.xlsx
   Funções puras: nada aqui toca banco, rede ou DOM.
   ============================================================ */

const RATING_BASE = 1000;
const ODD_DIVISOR = 540;

/* Diferença mínima de rating para uma vitória contar como ZEBRA.
   Vencer alguém 5 pontos acima não é zebra, é jogo parelho.
   O admin muda esse corte na tela; isto é só o padrão. */
const ZEBRA_MINIMA = 50;

/* --- Tabela de pontos por diferença de rating (aba Regras) ---
   GF = favorito vence | PF = zebra vence / favorito perde | PZ = zebra perde */
function faixaPontos(dif) {
  if (dif > 350) return { gf: 35, pf: 100, pz: 100 };
  if (dif > 250) return { gf: 30, pf: 80, pz: 70 };
  if (dif > 150) return { gf: 25, pf: 50, pz: 45 };
  if (dif > 50) return { gf: 20, pf: 35, pz: 30 };
  return { gf: 15, pf: 20, pz: 15 };
}

/** Odd no formato do app: 1 + 10^((ratingAdversario - ratingProprio)/540) */
function calcOdd(ratingProprio, ratingAdversario) {
  return Math.round((1 + Math.pow(10, (ratingAdversario - ratingProprio) / ODD_DIVISOR)) * 100) / 100;
}

/** Ordem cronológica canônica: data, depois ordem de lançamento. */
function ordenarJogos(jogos) {
  return [...jogos].sort((a, b) => {
    if (a.data !== b.data) return a.data < b.data ? -1 : 1;
    return (a.ordem ?? 0) - (b.ordem ?? 0);
  });
}

/* ============================================================
   PROCESSAR: percorre o histórico e devolve o estado completo
   ============================================================ */
function processar(jogadores, jogosBrutos, zebraMinima = ZEBRA_MINIMA) {
  const jogos = ordenarJogos(jogosBrutos);
  const rating = {};
  const pos = {};
  const stats = {};

  for (const j of jogadores) {
    rating[j.id] = j.rating_inicial ?? RATING_BASE;
    pos[j.id] = j.pos_inicial;
    stats[j.id] = {
      jogos: 0, v: 0, e: 0, d: 0, zebras: 0,
      historicoRating: [{ data: null, rating: rating[j.id] }],
      linha: [],   // resultados válidos em ordem: 'V' | 'E' | 'D'
      h2h: {},     // adversario_id -> {v,e,d}
      ultimoJogo: null
    };
  }

  const detalhes = [];

  for (const g of jogos) {
    const D = g.desafiado_id, C = g.desafiante_id;
    if (rating[D] === undefined || rating[C] === undefined) continue; // jogador removido

    const rD = rating[D], rC = rating[C];
    const pD = pos[D], pC = pos[C];
    const dif = Math.abs(rD - rC);
    const { gf, pf, pz } = faixaPontos(dif);

    // 'historico' = partida importada da planilha: conta para estatística e H2H,
    // mas o rating dela já está embutido no rating_inicial de cada jogador.
    const historico = g.tipo === 'historico';
    const amistoso = g.tipo === 'amistoso';
    const empate = g.vencedor_id === null || g.vencedor_id === undefined;

    let dD = 0, dC = 0;
    if (!amistoso && !historico && !empate) {
      if (rD >= rC) {                                    // desafiado é o favorito
        dD = g.vencedor_id === D ? gf : -pf;
        dC = g.vencedor_id === C ? pf : -pz;
      } else {                                           // desafiante é o favorito
        dD = g.vencedor_id === D ? pf : -pz;
        dC = g.vencedor_id === C ? gf : -pf;
      }
    }

    // Validade do desafio no ladder
    let situacao;
    if (amistoso) situacao = 'amistoso';
    else if (historico) situacao = 'historico';
    else if (g.tipo === 'so_rating') situacao = 'so_rating';
    else if (pC - pD < 1) situacao = 'invertido';
    else if (pC - pD > 2) situacao = 'fora_alcance';
    else situacao = 'ok';

    // Troca de posição: só quando o desafiante vence um desafio válido
    let trocou = false;
    if (situacao === 'ok' && g.vencedor_id === C) {
      pos[D] = pC;
      pos[C] = pD;
      trocou = true;
    }

    // Zebra: venceu quem tinha o rating MENOR, e por uma margem que valha a pena.
    const zebra = !empate && !amistoso && !historico && dif >= zebraMinima &&
      ((rD < rC && g.vencedor_id === D) || (rD > rC && g.vencedor_id === C));

    rating[D] = rD + dD;
    rating[C] = rC + dC;

    // Estatísticas (amistoso não conta para nada)
    if (!amistoso) {
      for (const [eu, adv] of [[D, C], [C, D]]) {
        const s = stats[eu];
        s.jogos++;
        s.h2h[adv] = s.h2h[adv] || { v: 0, e: 0, d: 0 };
        let res;
        if (empate) { s.e++; s.h2h[adv].e++; res = 'E'; }
        else if (g.vencedor_id === eu) { s.v++; s.h2h[adv].v++; res = 'V'; }
        else { s.d++; s.h2h[adv].d++; res = 'D'; }
        s.linha.push({ res, data: g.data, adv, odd: null });
        s.ultimoJogo = g.data;
      }
      if (zebra) stats[g.vencedor_id].zebras++;
    }
    stats[D].historicoRating.push({ data: g.data, rating: rating[D] });
    stats[C].historicoRating.push({ data: g.data, rating: rating[C] });

    detalhes.push({
      ...g,
      rtg_def_antes: rD, rtg_chal_antes: rC,
      rtg_def_depois: rating[D], rtg_chal_depois: rating[C],
      pos_def_antes: pD, pos_chal_antes: pC,
      delta_def: dD, delta_chal: dC,
      dif, situacao, trocou, zebra,
      odd_def: calcOdd(rD, rC), odd_chal: calcOdd(rC, rD)
    });
  }

  return { rating, pos, stats, detalhes, jogos };
}

/* ============================================================
   LADDER: resolve pos_manual e garante uma permutação limpa 1..N
   ============================================================ */
function montarLadder(jogadores, estado) {
  const base = jogadores
    .filter(j => j.ativo !== false && j.joga !== false)
    .map(j => ({ ...j, rating: estado.rating[j.id] ?? RATING_BASE, posCalc: estado.pos[j.id] ?? 9999 }));

  // 1) quem não tem ajuste manual entra na ordem calculada pelos resultados
  const lista = base.filter(j => j.pos_manual == null)
    .sort((a, b) => (a.posCalc - b.posCalc) || (b.rating - a.rating) || a.nome.localeCompare(b.nome));

  // 2) quem tem ajuste manual é encaixado exatamente na posição pedida
  for (const m of base.filter(j => j.pos_manual != null).sort((a, b) => a.pos_manual - b.pos_manual)) {
    lista.splice(Math.max(0, Math.min(lista.length, m.pos_manual - 1)), 0, m);
  }

  return lista.map((j, i) => ({ ...j, pos: i + 1 }));
}

/** Quem este jogador pode desafiar: até 2 posições acima. */
function alvosPossiveis(ladder, jogadorId) {
  const eu = ladder.find(j => j.id === jogadorId);
  if (!eu) return [];
  return ladder.filter(j => eu.pos - j.pos >= 1 && eu.pos - j.pos <= 2);
}

function desafioValido(ladder, desafianteId, desafiadoId) {
  const a = ladder.find(j => j.id === desafianteId);
  const b = ladder.find(j => j.id === desafiadoId);
  if (!a || !b) return { ok: false, motivo: 'Jogador fora do ladder.' };
  const gap = a.pos - b.pos;
  if (gap < 1) return { ok: false, motivo: 'Você só pode desafiar quem está ACIMA de você.' };
  if (gap > 2) return { ok: false, motivo: 'Alcance máximo é de 2 posições acima.' };
  return { ok: true, motivo: 'OK' };
}

/* ============================================================
   RANKING (pontos corridos): V=3, E=1, D=0 — ordena por rating
   ============================================================ */
function montarRanking(jogadores, estado) {
  return jogadores
    .filter(j => j.ativo !== false && j.joga !== false)
    .map(j => {
      const s = estado.stats[j.id] || { jogos: 0, v: 0, e: 0, d: 0, zebras: 0, linha: [] };
      return {
        ...j,
        rating: estado.rating[j.id] ?? RATING_BASE,
        jogos: s.jogos, v: s.v, e: s.e, d: s.d, zebras: s.zebras,
        pontos: 3 * s.v + s.e,
        winrate: s.jogos ? s.v / s.jogos : 0
      };
    })
    .sort((a, b) => (b.rating - a.rating) || (b.pontos - a.pontos) || a.nome.localeCompare(b.nome))
    .map((j, i) => ({ ...j, posRanking: i + 1 }));
}

/* ============================================================
   FALA SCORE — JOGADOR (0 a 100)
   ------------------------------------------------------------
   Rating relativo .... 40%  850 pts = 0 · 1250 pts = 100
   Aproveitamento ..... 25%  (V + 0,5·E) / jogos
   Forma recente ...... 20%  últimos 5 jogos, peso 5-4-3-2-1
   Atividade .......... 15%  jogos nos últimos 90 dias (satura em 6)
   Confiança: com menos de 8 jogos, o score é puxado para 50.
   ============================================================ */
const FAIXAS_JOGADOR = [
  { min: 90, nome: 'Lenda do Fala', cor: '#c9a227' },
  { min: 75, nome: 'Craque', cor: '#3fb950' },
  { min: 60, nome: 'Bom de Taco', cor: '#4493f8' },
  { min: 45, nome: 'Regular', cor: '#8b949e' },
  { min: 25, nome: 'Amador', cor: '#d29922' },
  { min: 0, nome: 'Iniciante', cor: '#f85149' }
];

const FAIXAS_APOSTADOR = [
  { min: 90, nome: 'Oráculo', cor: '#c9a227' },
  { min: 75, nome: 'Tubarão', cor: '#3fb950' },
  { min: 60, nome: 'Faro Bom', cor: '#4493f8' },
  { min: 45, nome: 'Equilibrado', cor: '#8b949e' },
  { min: 25, nome: 'Apostador', cor: '#d29922' },
  { min: 0, nome: 'Pé-frio', cor: '#f85149' }
];

function faixaDe(score, tabela) {
  return tabela.find(f => score >= f.min) || tabela[tabela.length - 1];
}

const clamp01 = x => Math.max(0, Math.min(1, x));

function diasEntre(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function falaScoreJogador(jogadorId, estado, hoje = new Date().toISOString().slice(0, 10)) {
  const s = estado.stats[jogadorId];
  const rating = estado.rating[jogadorId] ?? RATING_BASE;
  if (!s) return null;

  const fRating = clamp01((rating - 850) / 400);
  const fAprov = s.jogos ? (s.v + 0.5 * s.e) / s.jogos : 0.5;

  const ult = s.linha.slice(-5);
  let num = 0, den = 0;
  ult.forEach((r, i) => {
    const peso = ult.length - i;          // mais recente pesa mais
    den += peso;
    num += peso * (r.res === 'V' ? 1 : r.res === 'E' ? 0.5 : 0);
  });
  const fForma = den ? num / den : 0.5;

  const recentes = s.linha.filter(r => diasEntre(r.data, hoje) <= 90).length;
  const fAtiv = clamp01(recentes / 6);

  const bruto = 100 * (0.40 * fRating + 0.25 * fAprov + 0.20 * fForma + 0.15 * fAtiv);
  const confianca = clamp01(s.jogos / 8);
  const score = Math.round(50 + (bruto - 50) * confianca);

  return {
    score,
    faixa: faixaDe(score, FAIXAS_JOGADOR),
    confianca,
    componentes: [
      { rotulo: 'Rating', peso: 40, valor: fRating, detalhe: `${rating} pts` },
      { rotulo: 'Aproveitamento', peso: 25, valor: fAprov, detalhe: `${(fAprov * 100).toFixed(0)}%` },
      { rotulo: 'Forma recente', peso: 20, valor: fForma, detalhe: ult.map(r => r.res).join('') || '—' },
      { rotulo: 'Atividade', peso: 15, valor: fAtiv, detalhe: `${recentes} jogo(s) em 90d` }
    ]
  };
}

/* ============================================================
   FALA SCORE — APOSTADOR (0 a 100)
   ------------------------------------------------------------
   ROI ................ 40%  -50% = 0 · 0% = 50 · +50% = 100
   Taxa de acerto ..... 25%  ganhas / liquidadas
   Faro (odd média) ... 15%  média das odds que ele ACERTOU
   Volume ............. 10%  satura em 15 apostas liquidadas
   Disciplina ......... 10%  penaliza concentrar tudo numa aposta só
   Confiança: com menos de 10 apostas liquidadas, é puxado para 50.
   ============================================================ */
function falaScoreApostador(apostadorId, apostas) {
  const minhas = apostas.filter(a => a.apostador_id === apostadorId);
  const liq = minhas.filter(a => ['ganha', 'perdida'].includes(a.status));

  if (!minhas.length) {
    return {
      score: 50, faixa: faixaDe(50, FAIXAS_APOSTADOR), confianca: 0, semDados: true,
      totalApostado: 0, retornoTotal: 0, lucro: 0, roi: 0, acertos: 0, liquidadas: 0,
      componentes: []
    };
  }

  const totalApostado = liq.reduce((t, a) => t + a.moedas, 0);
  const retornoTotal = liq.reduce((t, a) => t + (a.retorno || 0), 0);
  const lucro = retornoTotal - totalApostado;
  const roi = totalApostado ? lucro / totalApostado : 0;
  const ganhas = liq.filter(a => a.status === 'ganha');

  const fRoi = clamp01((roi + 0.5) / 1.0);
  const fAcerto = liq.length ? ganhas.length / liq.length : 0.5;
  const oddMedia = ganhas.length ? ganhas.reduce((t, a) => t + Number(a.odd), 0) / ganhas.length : 0;
  const fFaro = ganhas.length ? clamp01((oddMedia - 1.2) / 1.8) : 0;
  const fVolume = clamp01(liq.length / 15);

  const maior = liq.length ? Math.max(...liq.map(a => a.moedas)) : 0;
  const concentracao = totalApostado ? maior / totalApostado : 1;
  const fDisc = clamp01((0.6 - concentracao) / 0.5);

  const bruto = 100 * (0.40 * fRoi + 0.25 * fAcerto + 0.15 * fFaro + 0.10 * fVolume + 0.10 * fDisc);
  const confianca = clamp01(liq.length / 10);
  const score = Math.round(50 + (bruto - 50) * confianca);

  return {
    score, faixa: faixaDe(score, FAIXAS_APOSTADOR), confianca, semDados: false,
    totalApostado, retornoTotal, lucro, roi,
    acertos: ganhas.length, liquidadas: liq.length, abertas: minhas.length - liq.length,
    componentes: [
      { rotulo: 'ROI', peso: 40, valor: fRoi, detalhe: `${(roi * 100).toFixed(0)}%` },
      { rotulo: 'Taxa de acerto', peso: 25, valor: fAcerto, detalhe: `${ganhas.length}/${liq.length}` },
      { rotulo: 'Faro (odd média)', peso: 15, valor: fFaro, detalhe: oddMedia ? oddMedia.toFixed(2) : '—' },
      { rotulo: 'Volume', peso: 10, valor: fVolume, detalhe: `${liq.length} liquidada(s)` },
      { rotulo: 'Disciplina', peso: 10, valor: fDisc, detalhe: `maior = ${(concentracao * 100).toFixed(0)}% do total` }
    ]
  };
}

/* --- Saldo de moedas a partir do extrato (append-only) --- */
function saldoDe(jogadorId, lancamentos) {
  return lancamentos
    .filter(l => l.jogador_id === jogadorId)
    .reduce((t, l) => t + l.delta, 0);
}

/* --- Sequência atual (streak) --- */
function streak(jogadorId, estado) {
  const linha = estado.stats[jogadorId]?.linha || [];
  if (!linha.length) return { tipo: null, n: 0 };
  const tipo = linha[linha.length - 1].res;
  let n = 0;
  for (let i = linha.length - 1; i >= 0 && linha[i].res === tipo; i--) n++;
  return { tipo, n };
}

/* ============================================================
   GERADOR DE JOGOS DO CONFRA
   ------------------------------------------------------------
   A noite é uma ESCADA: começa embaixo e vai subindo até o jogo do cinturão.
     • rodada 1        → confrontos das posições mais baixas
     • rodadas do meio → vai subindo pela tabela
     • última rodada   → o #1 dos presentes defende o cinturão
   Quem ganha embaixo sobe no ladder e chega mais perto do topo antes do fim.

   Dentro de cada faixa da escada, o desempate usa:
     • posição no ladder  → prioriza confrontos que VALEM posição
     • rating             → prioriza jogos parelhos (odd perto de 2.00)
     • histórico H2H      → prioriza quem nunca (ou quase nunca) se enfrentou
     • rodízio            → todo mundo joga o mesmo tanto, sem jogar 2x seguidas
   Não simula resultado: monta em cima do estado atual. Ao abrir cada rodada
   o app revalida se o confronto ainda é desafio de ladder ou virou amistoso.
   ============================================================ */
const ESTILOS_CONFRA = {
  equilibrio: { rotulo: 'Jogos parelhos', prox: 0.40, desafio: 0.15, novidade: 0.15 },
  posicao:    { rotulo: 'Valendo posição', prox: 0.15, desafio: 0.45, novidade: 0.10 },
  variedade:  { rotulo: 'Todo mundo com todo mundo', prox: 0.15, desafio: 0.15, novidade: 0.40 }
};

function gerarConfra(presentesIds, estado, ladder, opts = {}) {
  const { mesas = 2, jogosPorPessoa = 4, estilo = 'equilibrio', alcance = 2 } = opts;
  const P = ESTILOS_CONFRA[estilo] || ESTILOS_CONFRA.equilibrio;

  const presentes = presentesIds
    .map(id => ladder.find(j => j.id === id))
    .filter(Boolean);

  if (presentes.length < 2) return { rodadas: [], aviso: 'Marque pelo menos dois presentes.' };

  const jogosDe = {};            // quantas partidas cada um já tem na tabela
  const ultimaRodada = {};       // em que rodada cada um jogou por último
  const confrontosNoConfra = {}; // pares já escalados hoje
  presentes.forEach(j => { jogosDe[j.id] = 0; ultimaRodada[j.id] = -9; });

  const chave = (a, b) => [a, b].sort().join('|');
  const h2h = (a, b) => {
    const r = estado.stats[a]?.h2h?.[b];
    return r ? r.v + r.e + r.d : 0;
  };

  const montarPartida = (x, y) => {
    const desafiado = x.pos <= y.pos ? x : y;
    const desafiante = x.pos <= y.pos ? y : x;
    const gap = Math.abs(x.pos - y.pos);
    const h = estado.stats[x.id]?.h2h?.[y.id];
    return {
      mesa: 1, desafiado, desafiante,
      tipo: gap >= 1 && gap <= alcance ? 'desafio' : 'amistoso',
      peloCinturao: desafiado.pos === 1 || desafiante.pos === 1,
      duelo: !!(lider && segundo && ((x.id === lider.id && y.id === segundo.id) ||
                                     (y.id === lider.id && x.id === segundo.id))),
      aprovada: true,
      dif: Math.abs(x.rating - y.rating), gap,
      jaJogaram: h ? h.v + h.e + h.d : 0,
      odd_desafiado: calcOdd(desafiado.rating, desafiante.rating),
      odd_desafiante: calcOdd(desafiante.rating, desafiado.rating)
    };
  };

  const totalPartidas = Math.floor(presentes.length * jogosPorPessoa / 2);
  const nRodadas = Math.max(1, Math.ceil(totalPartidas / mesas));
  const rodadas = [];

  // A escada: da posição mais baixa até o topo, ao longo das rodadas.
  const posTopo = Math.min(...presentes.map(j => j.pos));
  const posBase = Math.max(...presentes.map(j => j.pos));
  const faixa = Math.max(1, posBase - posTopo);
  const lider = presentes.find(j => j.pos === posTopo);
  // O segundo colocado presente: o duelo #1 x #2 é obrigatório e fecha a noite.
  const segundo = presentes.filter(j => j.id !== lider?.id).sort((a, b) => a.pos - b.pos)[0];

  for (let r = 0; r < nRodadas; r++) {
    const ultima = r === nRodadas - 1;
    // Onde a noite está na escada: começa na base, termina no #1.
    const alvo = posBase - (r / Math.max(1, nRodadas - 1)) * faixa;
    const ocupados = new Set();
    const partidas = [];

    // monta todos os pares possíveis e dá uma nota para cada um
    const pares = [];
    for (let i = 0; i < presentes.length; i++) {
      for (let k = i + 1; k < presentes.length; k++) {
        const a = presentes[i], b = presentes[k];
        if (jogosDe[a.id] >= jogosPorPessoa || jogosDe[b.id] >= jogosPorPessoa) continue;

        const dif = Math.abs(a.rating - b.rating);
        const fProx = 1 - Math.min(1, dif / 300);

        const gap = Math.abs(a.pos - b.pos);
        const ehDesafio = gap >= 1 && gap <= alcance;
        const desafiante = a.pos > b.pos ? a : b;      // quem está embaixo é quem desafia
        const desafiado = a.pos > b.pos ? b : a;

        const jaJogaram = h2h(a.id, b.id);
        const repetidoHoje = confrontosNoConfra[chave(a.id, b.id)] || 0;
        const fNovidade = 1 / (1 + jaJogaram + repetidoHoje * 3);

        const fRodizio = 1 - (jogosDe[a.id] + jogosDe[b.id]) / (2 * jogosPorPessoa + 1);
        const descansou = (r - ultimaRodada[a.id] > 1) && (r - ultimaRodada[b.id] > 1);

        // A ESCADA manda: a altura do confronto é a melhor posição dos dois.
        const altura = Math.min(a.pos, b.pos);
        const fEscada = 1 - Math.min(1, Math.abs(altura - alvo) / faixa);

        // Degrau: escada se sobe de vizinho em vizinho. Par distante desanda a noite.
        const fVizinho = 1 - Math.min(1, Math.max(0, gap - alcance) / 4);

        // O cinturão é o fecho: o líder só entra na reta final.
        const envolveLider = lider && (a.id === lider.id || b.id === lider.id);
        const envolveSegundo = segundo && (a.id === segundo.id || b.id === segundo.id);
        // O líder só entra na reta final, e uma vaga fica guardada para a última rodada.
        if (envolveLider && r < nRodadas - Math.max(1, jogosPorPessoa)) continue;
        if (envolveLider && !ultima && jogosDe[lider.id] >= jogosPorPessoa - 1) continue;
        // O #2 também guarda uma vaga: o duelo do cinturão é obrigatório.
        if (envolveSegundo && !ultima && jogosDe[segundo.id] >= jogosPorPessoa - 1) continue;

        const nota = 0.50 * fEscada
                   + 0.35 * fVizinho
                   + (ultima && envolveLider ? 0.80 : 0)
                   + P.prox * fProx
                   + P.desafio * (ehDesafio ? 1 : 0)
                   + P.novidade * fNovidade
                   + 0.18 * fRodizio
                   + 0.05 * (descansou ? 1 : 0);

        pares.push({ a, b, nota, dif, gap, ehDesafio, desafiante, desafiado, jaJogaram });
      }
    }

    pares.sort((x, y) => y.nota - x.nota);

    const escalar = par => {
      if (partidas.length >= mesas) return false;
      if (ocupados.has(par.a.id) || ocupados.has(par.b.id)) return false;
      ocupados.add(par.a.id); ocupados.add(par.b.id);
      jogosDe[par.a.id]++; jogosDe[par.b.id]++;
      ultimaRodada[par.a.id] = r; ultimaRodada[par.b.id] = r;
      confrontosNoConfra[chave(par.a.id, par.b.id)] =
        (confrontosNoConfra[chave(par.a.id, par.b.id)] || 0) + 1;
      partidas.push(montarPartida(par.a, par.b));
      return true;
    };

    const inedito = x => !confrontosNoConfra[chave(x.a.id, x.b.id)];

    // A última rodada é a DECISÃO DO CINTURÃO: #1 contra #2, sempre.
    if (ultima && lider && segundo) {
      const duelo = pares.find(x =>
        (x.a.id === lider.id && x.b.id === segundo.id) ||
        (x.b.id === lider.id && x.a.id === segundo.id));
      if (duelo) escalar(duelo);
      else {
        // Se o par não sobrou entre os candidatos, monta na marra — é obrigatório.
        const gapD = Math.abs(lider.pos - segundo.pos);
        escalar({
          a: lider, b: segundo, nota: 99, gap: gapD,
          dif: Math.abs(lider.rating - segundo.rating),
          ehDesafio: gapD >= 1 && gapD <= alcance,
          desafiante: segundo, desafiado: lider,
          jaJogaram: (estado.stats[lider.id]?.h2h?.[segundo.id]
            ? estado.stats[lider.id].h2h[segundo.id].v + estado.stats[lider.id].h2h[segundo.id].e
              + estado.stats[lider.id].h2h[segundo.id].d : 0)
        });
      }
    }

    // Confrontos entre vizinhos primeiro, e sem repetir quem já jogou junto hoje.
    // Teto de distância: melhor deixar a mesa vazia do que marcar #1 contra #8.
    const perto = pares.filter(x => x.gap <= alcance + 3);
    for (const par of [...perto.filter(inedito), ...perto]) {
      if (partidas.length >= mesas) break;
      escalar(par);
    }
    // Só se a rodada ficaria completamente vazia é que o teto é relaxado.
    if (!partidas.length) {
      for (const par of [...pares.filter(inedito), ...pares]) {
        if (partidas.length >= mesas) break;
        escalar(par);
      }
    }

    if (!partidas.length) break;
    // Dentro da rodada, a mesa 1 é sempre o confronto mais alto da tabela.
    partidas.sort((x, y) => Math.min(x.desafiado.pos, x.desafiante.pos)
                          - Math.min(y.desafiado.pos, y.desafiante.pos));
    partidas.forEach((x, i) => { x.mesa = i + 1; });

    rodadas.push({
      n: rodadas.length + 1,
      partidas,
      temCinturao: partidas.some(x => x.peloCinturao),
      folga: presentes.filter(j => !ocupados.has(j.id)).map(j => j.nome)
    });
  }

  // Regra de ouro: o duelo #1 x #2 SEMPRE fecha a noite, aconteça o que acontecer.
  if (lider && segundo && !rodadas.some(r => r.partidas.some(p => p.duelo))) {
    rodadas.push({
      n: rodadas.length + 1,
      partidas: [montarPartida(lider, segundo)],
      temCinturao: true,
      folga: presentes.filter(j => j.id !== lider.id && j.id !== segundo.id).map(j => j.nome)
    });
    jogosDe[lider.id]++; jogosDe[segundo.id]++;
  }

  // O clímax é o cinturão: a rodada com o melhor jogo do líder vai para o fim.
  if (lider && rodadas.length > 1) {
    const iCint = rodadas.map((r, i) => ({ r, i }))
      .filter(({ r }) => r.partidas.some(p => p.duelo))
      .map(({ i }) => i).pop();
    if (iCint != null && iCint !== rodadas.length - 1) {
      rodadas.push(rodadas.splice(iCint, 1)[0]);
      rodadas.forEach((r, i) => { r.n = i + 1; });
    }
  }

  return {
    rodadas,
    resumo: presentes
      .map(j => ({ nome: j.nome, id: j.id, jogos: jogosDe[j.id] }))
      .sort((a, b) => b.jogos - a.jogos || a.nome.localeCompare(b.nome))
  };
}

/* ---------------------------------------------------------------- utilidades */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => new Intl.NumberFormat('pt-BR').format(Math.round(n || 0));
const dataBR = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-BR',
  { day: '2-digit', month: '2-digit', year: '2-digit' }) : '—';
const hojeISO = () => new Date().toLocaleDateString('sv-SE');

function toast(msg, tipo = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + tipo;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  const ms = tipo === 'erro' ? 7000 : 3600;
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, ms);
  setTimeout(() => t.remove(), ms + 350);
}
const erro = m => toast(m, 'erro');
const bom = m => toast(m, 'bom');

function modal(titulo, corpoHTML, aoAbrir) {
  const f = document.createElement('div');
  f.className = 'fundo-modal';
  f.innerHTML = `<div class="modal"><h3>${esc(titulo)}</h3>${corpoHTML}</div>`;
  f.addEventListener('click', e => { if (e.target === f) f.remove(); });
  document.addEventListener('keydown', function esq(e) {
    if (e.key === 'Escape') { f.remove(); document.removeEventListener('keydown', esq); }
  });
  $('#modais').appendChild(f);
  aoAbrir?.(f, () => f.remove());
  f.querySelector('input,select,textarea,button')?.focus();
  return f;
}

/* ---------------------------------------------------------------- estado */
let sb = null;
const S = {
  jogadores: [], jogos: [], desafios: [], apostas: [], carteira: [], config: {},
  eu: null, admin: false, aba: 'ranking',
  estado: null, ladder: [], ranking: [], carregando: false
};

const nomeDe = id => S.jogadores.find(j => j.id === id)?.nome || '—';
const jogDe = id => S.jogadores.find(j => j.id === id);
const saldoAtual = id => saldoDe(id, S.carteira);
const cfg = (k, d) => (S.config[k] !== undefined ? S.config[k] : d);

function recalcular() {
  S.estado = processar(S.jogadores, S.jogos, Number(cfg('zebra_minima', 50)));
  S.ladder = montarLadder(S.jogadores, S.estado);
  S.ranking = montarRanking(S.jogadores, S.estado);
}

/* ---------------------------------------------------------------- dados */
async function carregar() {
  S.carregando = true;
  const [jg, jo, de, ap, ca, co] = await Promise.all([
    sb.from('jogadores').select('*').order('nome'),
    sb.from('jogos').select('*').order('data').order('ordem'),
    sb.from('desafios').select('*').order('criado_em', { ascending: false }),
    sb.from('apostas').select('*').order('id', { ascending: false }),
    sb.from('carteira').select('*').order('id', { ascending: false }),
    sb.from('config').select('*')
  ]);
  const falhou = [jg, jo, de, ap, ca, co].find(r => r.error);
  if (falhou) throw new Error(falhou.error.message);

  S.jogadores = jg.data; S.jogos = jo.data; S.desafios = de.data;
  S.apostas = ap.data; S.carteira = ca.data;
  S.config = Object.fromEntries(co.data.map(c => [c.chave, c.valor]));
  recalcular();
  S.carregando = false;
}

async function recarregar() {
  try { await carregar(); render(); }
  catch (e) { erro('Não consegui atualizar: ' + e.message); }
}

/** Chama uma função do banco e trata o erro com mensagem legível. */
async function rpc(nome, args) {
  const { data, error } = await sb.rpc(nome, args);
  if (error) {
    const cru = error.message || '';
    // Erros típicos de banco desatualizado — vale explicar em vez de mostrar o texto do Postgres.
    if (/could not find the function|does not exist|schema cache/i.test(cru)) {
      throw new Error('O banco ainda está na versão antiga. Rode o 1-banco.sql atualizado no Supabase.');
    }
    throw new Error(cru.replace(/^.*?:\s*/, '') || 'Erro no servidor');
  }
  return data;
}

/* ---------------------------------------------------------------- entrada */
async function iniciar() {
  const c = window.FS_CONFIG || {};
  if (!c.SUPABASE_URL || c.SUPABASE_URL.includes('SEU-PROJETO')) {
    $('#entrada-sub').textContent = 'Falta configurar o Supabase.';
    $('#entrada-erro').innerHTML = `<div class="aviso alerta" style="text-align:left">
      <div><b>Abra o arquivo <code>config.js</code></b> e cole a URL e a chave anon do seu
      projeto Supabase. O passo a passo completo está no <code>README.md</code>.</div></div>`;
    return;
  }
  sb = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);

  try { await carregar(); }
  catch (e) {
    $('#entrada-sub').textContent = 'Não consegui falar com o banco.';
    $('#entrada-erro').innerHTML = `<div class="aviso erro" style="text-align:left">
      <div>${esc(e.message)}<br><br>Confira se você rodou os arquivos de
      <code>supabase/</code> no SQL Editor e se a URL e a chave em <code>config.js</code> estão certas.</div></div>`;
    return;
  }

  const { data: sessao } = await sb.auth.getSession();
  if (sessao?.session) {
    const { data } = await sb.from('admins').select('user_id').limit(1);
    S.admin = !!(data && data.length);
  }

  const salvo = localStorage.getItem('fs_eu');
  if (salvo && S.jogadores.some(j => j.id === salvo)) { S.eu = salvo; abrirApp(); }
  else telaEntrada();
}

function telaEntrada() {
  $('#app').hidden = true;
  $('#tela-entrada').hidden = false;
  $('#entrada-sub').textContent = S.admin ? 'Você está logado como admin. Escolha seu nome.'
                                          : 'Quem é você?';
  const lista = [...S.jogadores].filter(j => j.ativo).sort((a, b) => {
    const pa = S.ladder.find(x => x.id === a.id)?.pos ?? 999;
    const pb = S.ladder.find(x => x.id === b.id)?.pos ?? 999;
    return pa - pb || a.nome.localeCompare(b.nome);
  });
  $('#lista-jogadores').innerHTML = lista.map(j => {
    const p = S.ladder.find(x => x.id === j.id);
    return `<button data-id="${esc(j.id)}">
      ${j.foto_url ? `<img class="av" src="${esc(j.foto_url)}" alt="" style="width:46px;height:46px">`
                   : `<span class="e">${esc(j.emoji || '🎱')}</span>`}
      <span class="n">${esc(j.nome)}</span>
      <span class="p">${p ? '#' + p.pos + ' · ' + p.rating : 'apostador'}</span>
    </button>`;
  }).join('');
  $('#lista-jogadores').onclick = e => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    S.eu = b.dataset.id;
    localStorage.setItem('fs_eu', S.eu);
    abrirApp();
  };
}

function abrirApp() {
  $('#tela-entrada').hidden = true;
  $('#app').hidden = false;
  render();
}

$('#btn-login-admin').onclick = () => loginAdmin();
document.addEventListener('click', e => {
  if (e.target.id === 'btn-trocar') {
    localStorage.removeItem('fs_eu'); S.eu = null; telaEntrada();
  }
});

function loginAdmin() {
  if (S.admin) {
    modal('Sair do modo admin', `<p style="color:var(--texto-fraco);font-size:14px">
      Você continua vendo o app normalmente, mas perde o acesso à aba ADM.</p>
      <div class="linha" style="justify-content:flex-end;margin-top:14px">
        <button class="btn" data-x>Cancelar</button>
        <button class="btn perigo" data-sair>Sair do admin</button></div>`,
      (f, fechar) => {
        f.querySelector('[data-x]').onclick = fechar;
        f.querySelector('[data-sair]').onclick = async () => {
          await sb.auth.signOut(); S.admin = false; fechar();
          bom('Você saiu do modo admin.'); render(); telaEntrada();
        };
      });
    return;
  }
  modal('Entrar como administrador', `
    <label class="campo"><span>E-mail</span><input type="email" id="m-email" autocomplete="username"></label>
    <label class="campo"><span>Senha</span><input type="password" id="m-senha" autocomplete="current-password"></label>
    <div id="m-erro"></div>
    <div class="linha" style="justify-content:flex-end;margin-top:6px">
      <button class="btn" data-x>Cancelar</button>
      <button class="btn p" data-ok>Entrar</button></div>`,
    (f, fechar) => {
      f.querySelector('[data-x]').onclick = fechar;
      const entrar = async () => {
        const email = f.querySelector('#m-email').value.trim();
        const senha = f.querySelector('#m-senha').value;
        const btn = f.querySelector('[data-ok]');
        btn.disabled = true; btn.textContent = 'Entrando…';
        const { error } = await sb.auth.signInWithPassword({ email, password: senha });
        if (error) {
          f.querySelector('#m-erro').innerHTML =
            `<div class="aviso erro"><div>E-mail ou senha incorretos.</div></div>`;
          btn.disabled = false; btn.textContent = 'Entrar';
          return;
        }
        const { data } = await sb.from('admins').select('user_id').limit(1);
        if (!data || !data.length) {
          await sb.auth.signOut();
          f.querySelector('#m-erro').innerHTML =
            `<div class="aviso erro"><div>Esse usuário existe, mas não está na tabela
             <code>admins</code>. Rode o arquivo <code>03-admin.sql</code>.</div></div>`;
          btn.disabled = false; btn.textContent = 'Entrar';
          return;
        }
        S.admin = true; fechar(); bom('Modo admin liberado.');
        await recarregar();
        if (!S.eu) telaEntrada();
      };
      f.querySelector('[data-ok]').onclick = entrar;
      f.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
    });
}

/* ---------------------------------------------------------------- render */
const ABAS = [
  ['ranking', 'Ranking'], ['ladder', 'Ladder'], ['jogos', 'Jogos'],
  ['carteira', 'Carteira'], ['perfil', 'Perfil']
];

function render() {
  const eu = jogDe(S.eu);
  const temp = cfg('nome_temporada', 'Temporada');
  $('#temporada').textContent = String(temp).toUpperCase();
  $('#rodape-info').textContent =
    `${S.jogos.length} partidas · ${S.jogadores.filter(j => j.ativo).length} membros`;

  const fs = eu ? falaScoreJogador(eu.id, S.estado) : null;
  $('#caixa-eu').innerHTML = eu ? `
    ${avatar(eu, 24)}
    <b>${esc(eu.nome)}</b>
    <span class="moedas">🪙 ${nf(saldoAtual(eu.id))}</span>
    ${fs ? `<span class="tag" style="background:${fs.faixa.cor}22;color:${fs.faixa.cor};
       border-color:${fs.faixa.cor}55">${fs.score}</span>` : ''}` : '';

  const abas = [...ABAS];
  if (S.admin) abas.push(['adm', '🔒 ADM']);
  if (!abas.some(a => a[0] === S.aba)) S.aba = 'ranking';
  $('#nav').innerHTML = abas.map(([k, n]) =>
    `<button data-aba="${k}" class="${k === 'adm' ? 'adm ' : ''}${S.aba === k ? 'on' : ''}">${esc(n)}</button>`
  ).join('');
  $('#nav').onclick = e => {
    const b = e.target.closest('[data-aba]');
    if (b) { S.aba = b.dataset.aba; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  };

  const alvo = $('#conteudo');
  alvo.innerHTML = ({
    ranking: viewRanking, ladder: viewLadder, jogos: viewJogos,
    carteira: viewCarteira, perfil: viewPerfil, adm: viewAdm
  }[S.aba] || viewRanking)();
  ligarEventos(alvo);
}

/* ------------------------------------------------------------ componentes */
function pip(j) {
  const fs = falaScoreJogador(j.id, S.estado);
  return `<span class="mini-score" title="Fala Score: ${fs.faixa.nome}">
    <i class="pip" style="background:${fs.faixa.cor}"></i>${fs.score}</span>`;
}

/** Foto do jogador quando existe; senão o emoji dele. */
function avatar(j, px = 26) {
  if (j?.foto_url) {
    return `<img class="av" src="${esc(j.foto_url)}" alt=""
      style="width:${px}px;height:${px}px" loading="lazy">`;
  }
  return `<span class="em" style="font-size:${Math.round(px * 0.66)}px">${esc(j?.emoji || '🎱')}</span>`;
}

function celJogador(j, extra = '') {
  return `<div class="jog">${avatar(j, 26)}<b>${esc(j.nome)}</b>${extra}</div>`;
}

function formaHTML(id, n = 5) {
  const linha = (S.estado.stats[id]?.linha || []).slice(-n);
  if (!linha.length) return '<span style="color:var(--texto-fraco)">—</span>';
  return `<span class="forma">${linha.map(r => `<i class="${r.res}">${r.res}</i>`).join('')}</span>`;
}

function aro(score, cor, rotulo = 'Fala Score') {
  const R = 48, C = 2 * Math.PI * R;
  const off = C * (1 - Math.max(0, Math.min(100, score)) / 100);
  return `<div class="aro">
    <svg width="112" height="112" viewBox="0 0 112 112">
      <circle cx="56" cy="56" r="${R}" fill="none" stroke="#0a1410" stroke-width="9"/>
      <circle cx="56" cy="56" r="${R}" fill="none" stroke="${cor}" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="valor"><div><b style="color:${cor}">${score}</b><small>${esc(rotulo)}</small></div></div>
  </div>`;
}

function componentes(lista) {
  return lista.map(c => `<div class="comp">
    <div class="comp-topo"><span>${esc(c.rotulo)} <span style="color:var(--texto-fraco)">(${c.peso}%)</span></span>
      <span>${esc(c.detalhe)}</span></div>
    <div class="barra"><i style="width:${(c.valor * 100).toFixed(0)}%"></i></div></div>`).join('');
}

function sparkline(pontos) {
  if (pontos.length < 2) return '';
  const vs = pontos.map(p => p.rating);
  const min = Math.min(...vs), max = Math.max(...vs), amp = (max - min) || 1;
  const W = 300, H = 60;
  const d = vs.map((v, i) =>
    `${i ? 'L' : 'M'}${(i / (vs.length - 1) * W).toFixed(1)},${(H - (v - min) / amp * H).toFixed(1)}`).join(' ');
  const sobe = vs[vs.length - 1] >= vs[0];
  const cor = sobe ? 'var(--verde)' : 'var(--vermelho)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

const vazio = (ic, txt) => `<div class="vazio"><span class="ic">${ic}</span>${esc(txt)}</div>`;

/** Quem está no #1 do ladder é o dono do cinturão. */
const campeao = () => S.ladder[0] || null;

/** 🏆 ×N — cinturões já conquistados (o admin lança na mão). */
function cintHTML(j, tam = 13) {
  const n = j?.cinturoes || 0;
  if (!n) return '';
  return `<span class="cint" style="font-size:${tam}px" title="${n} cinturão(ões) na história">🏆${n > 1 ? ' ×' + n : ''}</span>`;
}

/** Faixa grande do campeão atual. */
function faixaCampeao() {
  const c = campeao();
  if (!c) return '';
  const souEu = c.id === S.eu;
  return `<div class="cinturao">
    <div class="cint-ico">🏆</div>
    <div class="cint-txt">
      <span>Cinturão atual</span>
      <b>${avatar(c, 26)} ${esc(c.nome)}</b>
      <small>#1 do ladder · rating ${c.rating}${c.cinturoes ? ` · ${c.cinturoes}º título` : ''}</small>
    </div>
    ${souEu ? '<div class="cint-voce">é você</div>' : ''}
  </div>`;
}

function viewRanking() {
  const r = S.ranking;
  if (!r.length) return `<div class="card">${vazio('🎱', 'Nenhum jogador cadastrado ainda.')}</div>`;
  const lider = r[0];
  return `
  ${faixaCampeao()}
  <div class="card">
    <h2>Ranking</h2>
    <p class="sub">Ordenado pelo rating. Vitória vale 3 pontos, empate 1.</p>
    <div class="grade g3" style="margin-bottom:18px">
      <div class="kpi"><span>Líder</span><b>${esc(lider.emoji || '')} ${esc(lider.nome)}</b></div>
      <div class="kpi"><span>Partidas</span><b>${S.jogos.filter(g => g.tipo !== 'amistoso').length}</b></div>
      <div class="kpi"><span>Moedas em jogo</span><b>🪙 ${nf(S.carteira.reduce((t, c) => t + Math.max(0, c.delta), 0))}</b></div>
    </div>
    <div class="tab-rolagem"><table>
      <thead><tr>
        <th>#</th><th>Jogador</th><th class="num">Rating</th>
        <th class="num esconde-mob">J</th><th class="num esconde-mob">V</th>
        <th class="num esconde-mob">E</th><th class="num esconde-mob">D</th>
        <th class="num">Pts</th><th class="esconde-mob">Forma</th><th class="num">Score</th>
      </tr></thead>
      <tbody>${r.map(j => {
        const st = streak(j.id, S.estado);
        return `<tr class="${j.id === S.eu ? 'destaque' : ''}">
          <td><span class="pos p${j.posRanking}">${j.posRanking}</span></td>
          <td>${celJogador(j, cintHTML(j) + (st.n >= 3 ? `<span class="tag ${st.tipo === 'V' ? 't-verde' : 't-vermelho'}">
              ${st.n}${st.tipo}</span>` : ''))}</td>
          <td class="num"><b>${j.rating}</b></td>
          <td class="num esconde-mob">${j.jogos}</td>
          <td class="num esconde-mob" style="color:var(--verde)">${j.v}</td>
          <td class="num esconde-mob">${j.e}</td>
          <td class="num esconde-mob" style="color:var(--vermelho)">${j.d}</td>
          <td class="num"><b>${j.pontos}</b></td>
          <td class="esconde-mob">${formaHTML(j.id)}</td>
          <td class="num">${pip(j)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>

  <div class="card">
    <h2>Ranking dos apostadores</h2>
    <p class="sub">Quem mais lucra com as moedas. Fala Score de apostador em destaque.</p>
    ${(() => {
      const linhas = S.jogadores
        .map(j => ({ j, fs: falaScoreApostador(j.id, S.apostas), saldo: saldoAtual(j.id) }))
        .filter(x => !x.fs.semDados)
        .sort((a, b) => b.fs.lucro - a.fs.lucro || b.fs.score - a.fs.score);
      if (!linhas.length) return vazio('🪙', 'Ninguém apostou ainda.');
      return `<div class="tab-rolagem"><table>
        <thead><tr><th>#</th><th>Apostador</th><th class="num">Saldo</th>
          <th class="num esconde-mob">Apostado</th><th class="num">Lucro</th>
          <th class="num esconde-mob">Acerto</th><th class="num">Score</th></tr></thead>
        <tbody>${linhas.map((x, i) => `<tr class="${x.j.id === S.eu ? 'destaque' : ''}">
          <td><span class="pos p${i + 1}">${i + 1}</span></td>
          <td>${celJogador(x.j)}</td>
          <td class="num">🪙 ${nf(x.saldo)}</td>
          <td class="num esconde-mob">${nf(x.fs.totalApostado)}</td>
          <td class="num" style="color:${x.fs.lucro >= 0 ? 'var(--verde)' : 'var(--vermelho)'}">
            <b>${x.fs.lucro >= 0 ? '+' : ''}${nf(x.fs.lucro)}</b></td>
          <td class="num esconde-mob">${x.fs.liquidadas ? Math.round(x.fs.acertos / x.fs.liquidadas * 100) + '%' : '—'}</td>
          <td class="num"><span class="mini-score"><i class="pip" style="background:${x.fs.faixa.cor}"></i>${x.fs.score}</span></td>
        </tr>`).join('')}</tbody></table></div>`;
    })()}
  </div>`;
}

/* ------------------------------------------------------------ LADDER */
function viewLadder() {
  const eu = jogDe(S.eu);
  const minhaPos = S.ladder.find(j => j.id === S.eu);
  const alvos = minhaPos ? alvosPossiveis(S.ladder, S.eu).map(a => a.id) : [];
  const meuDesafioAberto = S.desafios.find(d =>
    d.status === 'aberto' && (d.desafiante_id === S.eu || d.desafiado_id === S.eu));

  return `
  ${faixaCampeao()}
  <div class="card">
    <h2>Ladder</h2>
    <p class="sub">Você desafia quem está até <b>2 posições acima</b>. Se ganhar, assume o lugar dele.</p>

    ${!minhaPos ? `<div class="aviso info"><div>Você está cadastrado como apostador, então não
      aparece no ladder — mas pode apostar normalmente na aba Desafios.</div></div>`
      : meuDesafioAberto ? `<div class="aviso alerta"><div>Você já tem um jogo marcado contra
      <b>${esc(nomeDe(meuDesafioAberto.desafiante_id === S.eu ? meuDesafioAberto.desafiado_id : meuDesafioAberto.desafiante_id))}</b>.
      Resolva ele antes de marcar outro.</div></div>`
      : alvos.length ? `<div class="aviso bom"><div>Você é o <b>#${minhaPos.pos}</b> e pode desafiar
      ${alvos.map(a => '<b>' + esc(nomeDe(a)) + '</b>').join(' ou ')}.
      Com o resto do pessoal dá para marcar um <b>amistoso</b>.</div></div>`
      : `<div class="aviso info"><div>Você é o <b>#1</b>: não tem ninguém acima para desafiar.
      Agora é defender o topo — ou marcar um <b>amistoso</b> com quem você quiser.</div></div>`}

    <div class="tab-rolagem"><table>
      <thead><tr><th>#</th><th>Jogador</th><th class="num">Rating</th>
        <th class="esconde-mob">Forma</th><th class="num">Score</th><th></th></tr></thead>
      <tbody>${S.ladder.map(j => {
        const souEu = j.id === S.eu;
        const podeDesafiar = alvos.includes(j.id) && !meuDesafioAberto;
        const podeAmistoso = minhaPos && !souEu && !podeDesafiar && !meuDesafioAberto;
        return `<tr class="${souEu ? 'destaque' : ''}${j.pos === 1 ? ' linha-campea' : ''}">
          <td><span class="pos p${j.pos}">${j.pos}</span></td>
          <td>${celJogador(j, (j.pos === 1 ? '<span class="tag t-ouro">👑 cinturão</span>' : '')
              + cintHTML(j) + (j.pos_manual ? '<span class="tag t-cinza">ajuste manual</span>' : ''))}</td>
          <td class="num"><b>${j.rating}</b></td>
          <td class="esconde-mob">${formaHTML(j.id, 4)}</td>
          <td class="num">${pip(j)}</td>
          <td style="text-align:right">${podeDesafiar
            ? `<button class="btn mini ok" data-desafiar="${esc(j.id)}">Desafiar</button>`
            : podeAmistoso
            ? `<button class="btn mini" data-amistoso="${esc(j.id)}">Amistoso</button>` : ''}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>

    <div class="aviso info" style="margin-top:14px"><div>
      <b>Desafio</b> — só em quem está até 2 posições acima. Se você ganhar, assume o lugar dele.<br>
      <b>Amistoso</b> — contra qualquer um, a qualquer hora. Vale rating e entra no ranking,
      mas <b>não mexe nas posições do ladder</b>. Dá para apostar do mesmo jeito.
    </div></div>
  </div>`;
}

/* ------------------------------------------------------------ JOGOS
   Uma aba só: em cima o que está marcado (para apostar e lançar resultado),
   embaixo o histórico completo de partidas.
   ------------------------------------------------------------ */
function secaoMarcados() {
  const abertos = S.desafios.filter(d => d.status === 'aberto');
  const permitePropria = cfg('aposta_propria', false);

  const cartao = d => {
    const A = jogDe(d.desafiado_id), B = jogDe(d.desafiante_id);
    if (!A || !B) return '';
    const rA = S.estado.rating[A.id], rB = S.estado.rating[B.id];
    const oddA = calcOdd(rA, rB), oddB = calcOdd(rB, rA);
    const minhas = S.apostas.filter(a => a.desafio_id === d.id && a.apostador_id === S.eu && a.status === 'aberta');
    const total = S.apostas.filter(a => a.desafio_id === d.id && a.status === 'aberta');
    const souJogador = [A.id, B.id].includes(S.eu);
    const podeApostar = S.eu && (permitePropria || !souJogador);

    const lado = (j, odd, outro) => `
      <div style="flex:1;min-width:150px;background:var(--painel-alto);border:1px solid var(--borda);
                  border-radius:11px;padding:13px;text-align:center">
        <div style="display:grid;place-items:center;margin-bottom:4px">${avatar(j, 44)}</div>
        <div style="font-weight:700;margin:3px 0">${esc(j.nome)}</div>
        <div style="font-size:12px;color:var(--texto-fraco)">rating ${S.estado.rating[j.id]}</div>
        <div style="font-size:23px;font-weight:800;color:var(--ouro-claro);margin:7px 0">${odd.toFixed(2)}×</div>
        ${podeApostar ? `<button class="btn mini p" style="width:100%"
            data-apostar="${esc(d.id)}" data-em="${esc(j.id)}" data-odd="${odd}">Apostar</button>`
          : `<div style="font-size:11.5px;color:var(--texto-fraco)">${souJogador ? 'você joga esta' : '—'}</div>`}
      </div>`;

    const ehAmistoso = d.tipo === 'amistoso';
    return `<div class="card">
      <div class="linha" style="justify-content:space-between;margin-bottom:12px">
        <div><span class="tag ${ehAmistoso ? 't-azul' : 't-ouro'}">
            ${ehAmistoso ? 'Amistoso · não mexe no ladder' : 'Desafio · vale posição'}</span>
          <span style="color:var(--texto-fraco);font-size:12.5px;margin-left:7px">
            ${ehAmistoso
              ? `#${S.ladder.find(x => x.id === B.id)?.pos ?? '?'} chamou #${S.ladder.find(x => x.id === A.id)?.pos ?? '?'}`
              : `#${S.ladder.find(x => x.id === B.id)?.pos ?? '?'} desafiou #${S.ladder.find(x => x.id === A.id)?.pos ?? '?'}`}
            · ${dataBR(d.criado_em?.slice(0, 10))}</span></div>
        ${d.desafiante_id === S.eu && !total.length
          ? `<button class="btn mini perigo" data-cancelar="${esc(d.id)}">Cancelar</button>` : ''}
      </div>
      <div class="linha" style="gap:11px;flex-wrap:nowrap;align-items:stretch">
        ${lado(A, oddA)}
        <div style="display:grid;place-items:center;color:var(--texto-fraco);font-weight:800;padding:0 3px">×</div>
        ${lado(B, oddB)}
      </div>
      ${souJogador ? `<div style="margin-top:13px;border-top:1px solid var(--borda);padding-top:13px">
        <div style="font-size:12.5px;color:var(--texto-fraco);margin-bottom:8px">
          Você joga esta. Quando terminar, lance o resultado aqui:</div>
        <div class="linha">
          <button class="btn ok mini" data-venceu="${esc(d.id)}" data-quem="${esc(S.eu)}">Eu venci</button>
          <button class="btn mini" data-venceu="${esc(d.id)}" data-quem="${esc(A.id === S.eu ? B.id : A.id)}">
            ${esc(A.id === S.eu ? B.nome : A.nome)} venceu</button>
          <button class="btn mini" data-venceu="${esc(d.id)}" data-quem="">Empate</button>
        </div></div>` : ''}
      ${minhas.length ? `<div class="aviso bom" style="margin-top:12px"><div>
        Sua aposta: ${minhas.map(a => `<b>${nf(a.moedas)} 🪙 em ${esc(nomeDe(a.em_id))} @ ${a.odd}×</b>`).join(', ')}
        — retorno de ${nf(minhas.reduce((t, a) => t + Math.round(a.moedas * a.odd), 0))} 🪙 se der certo.
      </div></div>` : ''}
      ${total.length ? `<div style="margin-top:11px;font-size:12.5px;color:var(--texto-fraco)">
        ${total.length} aposta(s) na mesa · ${nf(total.reduce((t, a) => t + a.moedas, 0))} 🪙 no total</div>` : ''}
    </div>`;
  };

  const encerrados = S.desafios.filter(d => d.status !== 'aberto').slice(0, 12);

  return `
    <div class="card">
      <h2>Jogos marcados</h2>
      <p class="sub">O jogador marca o jogo no Ladder — <b>desafio</b> (vale posição) ou
        <b>amistoso</b> (vale só rating). Enquanto está aberto, todo mundo pode apostar moedas.
        Terminou o jogo, <b>quem jogou</b> (ou o admin) lança o vencedor e o pagamento das
        apostas é automático.</p>
      ${S.eu ? `<div class="linha"><div class="kpi" style="flex:1">
        <span>Seu saldo</span><b>🪙 ${nf(saldoAtual(S.eu))}</b></div></div>` : ''}
    </div>
    ${abertos.length ? abertos.map(cartao).join('')
      : `<div class="card">${vazio('🥊', 'Nenhum jogo marcado. Vá no Ladder e marque o seu.')}</div>`}
    ${encerrados.length ? `<div class="card"><h2>Marcados recentemente</h2>
      <div class="tab-rolagem"><table>
        <thead><tr><th>Confronto</th><th>Tipo</th><th class="esconde-mob">Apostas</th><th>Situação</th></tr></thead>
        <tbody>${encerrados.map(d => {
          const jogo = S.jogos.find(g => g.desafio_id === d.id);
          const n = S.apostas.filter(a => a.desafio_id === d.id).length;
          return `<tr>
            <td>${esc(nomeDe(d.desafiado_id))} <span style="color:var(--texto-fraco)">×</span>
                ${esc(nomeDe(d.desafiante_id))}</td>
            <td><span class="tag ${d.tipo === 'amistoso' ? 't-azul' : 't-ouro'}">
                ${d.tipo === 'amistoso' ? 'amistoso' : 'desafio'}</span></td>
            <td class="esconde-mob">${n || '—'}</td>
            <td>${d.status === 'cancelado' ? '<span class="tag t-cinza">cancelado</span>'
              : jogo ? (jogo.vencedor_id ? `<span class="tag t-verde">${esc(nomeDe(jogo.vencedor_id))} venceu</span>`
                                         : '<span class="tag t-azul">empate</span>')
              : '<span class="tag t-cinza">jogado</span>'}</td>
          </tr>`;
        }).join('')}</tbody></table></div></div>` : ''}`;
}

function viewJogos() {
  return secaoMarcados() + secaoHistorico();
}

function secaoHistorico() {
  const det = [...S.estado.detalhes].reverse();
  const rotulo = {
    normal: '', so_rating: '<span class="tag t-azul">amistoso</span>',
    amistoso: '<span class="tag t-cinza">não contou</span>',
    historico: '<span class="tag t-cinza">planilha</span>'
  };
  return `<div class="card">
    <h2>Histórico de partidas</h2>
    <p class="sub">${det.length} partidas já jogadas. A primeira coluna é sempre o desafiado
      (quem estava em cima no ladder).</p>
    ${det.length ? `<div class="tab-rolagem"><table>
      <thead><tr><th>Data</th><th>Desafiado</th><th>Desafiante</th><th>Vencedor</th>
        <th class="num esconde-mob">Δ rating</th><th></th></tr></thead>
      <tbody>${det.map(g => `<tr>
        <td style="white-space:nowrap;color:var(--texto-fraco)">${dataBR(g.data)}</td>
        <td>${esc(nomeDe(g.desafiado_id))}</td>
        <td>${esc(nomeDe(g.desafiante_id))}</td>
        <td>${g.vencedor_id
          ? `<b>${esc(nomeDe(g.vencedor_id))}</b>${g.zebra ? ' <span class="tag t-ouro">zebra</span>' : ''}`
          : '<span class="tag t-cinza">empate</span>'}</td>
        <td class="num esconde-mob" style="font-variant-numeric:tabular-nums">
          ${g.delta_def || g.delta_chal
            ? `<span style="color:${g.delta_def >= 0 ? 'var(--verde)' : 'var(--vermelho)'}">${g.delta_def > 0 ? '+' : ''}${g.delta_def}</span>
               <span style="color:var(--texto-fraco)"> / </span>
               <span style="color:${g.delta_chal >= 0 ? 'var(--verde)' : 'var(--vermelho)'}">${g.delta_chal > 0 ? '+' : ''}${g.delta_chal}</span>`
            : '<span style="color:var(--texto-fraco)">—</span>'}</td>
        <td>${rotulo[g.tipo] || ''}${g.trocou ? '<span class="tag t-ouro">trocou posição</span>' : ''}
          ${g.lancado_por ? `<span class="tag t-cinza">lançado por ${esc(nomeDe(g.lancado_por))}</span>` : ''}
          ${S.admin ? `<button class="btn mini perigo" data-apagar-jogo="${esc(g.id)}"
            style="margin-left:6px">apagar</button>` : ''}</td>
      </tr>`).join('')}</tbody></table></div>` : vazio('📋', 'Nenhuma partida ainda.')}
  </div>`;
}

/* ------------------------------------------------------------ CARTEIRA */
function viewCarteira() {
  if (!S.eu) return `<div class="card">${vazio('🪙', 'Escolha seu nome para ver sua carteira.')}</div>`;
  const fs = falaScoreApostador(S.eu, S.apostas);
  const meus = S.carteira.filter(c => c.jogador_id === S.eu);
  const minhasApostas = S.apostas.filter(a => a.apostador_id === S.eu);
  const rotuloStatus = {
    aberta: '<span class="tag t-ouro">em aberto</span>',
    ganha: '<span class="tag t-verde">ganhou</span>',
    perdida: '<span class="tag t-vermelho">perdeu</span>',
    devolvida: '<span class="tag t-azul">devolvida</span>',
    cancelada: '<span class="tag t-cinza">cancelada</span>'
  };

  return `
  <div class="card">
    <h2>Carteira</h2>
    <p class="sub">Moedas do jogo. Só o administrador cria ou tira moedas — apostas debitam
      e creditam sozinhas.</p>
    <div class="grade g3">
      <div class="kpi"><span>Saldo</span><b style="color:var(--ouro-claro)">🪙 ${nf(saldoAtual(S.eu))}</b></div>
      <div class="kpi"><span>Total apostado</span><b>${nf(fs.totalApostado)}</b></div>
      <div class="kpi"><span>Lucro</span>
        <b style="color:${fs.lucro >= 0 ? 'var(--verde)' : 'var(--vermelho)'}">${fs.lucro >= 0 ? '+' : ''}${nf(fs.lucro)}</b></div>
    </div>
  </div>

  <div class="card">
    <h2>Fala Score de apostador</h2>
    <p class="sub">${fs.semDados ? 'Aposte algumas vezes para o score começar a valer.'
      : `${fs.liquidadas} aposta(s) liquidada(s)${fs.confianca < 1
        ? ` — abaixo de 10 o score fica puxado para o meio.` : '.'}`}</p>
    <div class="score-caixa">
      ${aro(fs.score, fs.faixa.cor, 'Apostador')}
      <div style="flex:1;min-width:230px">
        <div style="font-size:19px;font-weight:800;color:${fs.faixa.cor};margin-bottom:9px">${esc(fs.faixa.nome)}</div>
        ${fs.componentes.length ? componentes(fs.componentes)
          : '<p style="color:var(--texto-fraco);font-size:13.5px">Sem apostas liquidadas.</p>'}
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Minhas apostas</h2>
    ${minhasApostas.length ? `<div class="tab-rolagem"><table>
      <thead><tr><th>Quando</th><th>Apostei em</th><th class="num">Moedas</th>
        <th class="num">Odd</th><th class="num">Retorno</th><th>Situação</th></tr></thead>
      <tbody>${minhasApostas.map(a => `<tr>
        <td style="color:var(--texto-fraco);white-space:nowrap">${dataBR(a.criado_em?.slice(0, 10))}</td>
        <td>${esc(nomeDe(a.em_id))}</td>
        <td class="num">${nf(a.moedas)}</td>
        <td class="num">${Number(a.odd).toFixed(2)}×</td>
        <td class="num">${a.retorno != null ? nf(a.retorno) : '—'}</td>
        <td>${rotuloStatus[a.status] || ''}</td>
      </tr>`).join('')}</tbody></table></div>` : vazio('🎲', 'Você ainda não apostou.')}
  </div>

  <div class="card">
    <h2>Extrato</h2>
    <p class="sub">Livro-caixa. Nada aqui é apagado nem alterado — correções entram como estorno.</p>
    ${meus.length ? `<div class="tab-rolagem"><table>
      <thead><tr><th>Quando</th><th>Movimento</th><th class="num">Valor</th><th class="num">Saldo</th></tr></thead>
      <tbody>${(() => {
        const cres = [...meus].reverse();
        let acc = 0;
        const linhas = cres.map(c => { acc += c.delta; return { c, acc }; }).reverse();
        return linhas.map(({ c, acc }) => `<tr>
          <td style="color:var(--texto-fraco);white-space:nowrap">${dataBR(c.criado_em?.slice(0, 10))}</td>
          <td>${esc(c.descricao || c.tipo)}</td>
          <td class="num" style="color:${c.delta >= 0 ? 'var(--verde)' : 'var(--vermelho)'}">
            <b>${c.delta > 0 ? '+' : ''}${nf(c.delta)}</b></td>
          <td class="num" style="color:var(--texto-fraco)">${nf(acc)}</td>
        </tr>`).join('');
      })()}</tbody></table></div>` : vazio('📄', 'Sem movimentações ainda.')}
  </div>`;
}

/* ------------------------------------------------------------ PERFIL */
function viewPerfil() {
  const alvoId = S.perfilId || S.eu;
  const j = jogDe(alvoId);
  if (!j) return `<div class="card">${vazio('👤', 'Escolha um jogador.')}</div>`;

  const fs = falaScoreJogador(j.id, S.estado);
  const st = S.estado.stats[j.id] || { jogos: 0, v: 0, e: 0, d: 0, zebras: 0, h2h: {}, historicoRating: [] };
  const sq = streak(j.id, S.estado);
  const noLadder = S.ladder.find(x => x.id === j.id);
  const noRank = S.ranking.find(x => x.id === j.id);

  const h2h = Object.entries(st.h2h)
    .map(([id, r]) => ({ id, ...r, total: r.v + r.e + r.d }))
    .sort((a, b) => b.total - a.total);

  return `
  <div class="card">
    <div class="linha" style="justify-content:space-between">
      <h2 style="margin:0">Perfil</h2>
      <div class="linha">
      ${alvoId === S.eu ? '<button class="btn mini p" id="btn-personalizar">Personalizar</button>' : ''}
      <select id="sel-perfil" style="width:auto;min-width:170px">
        ${S.jogadores.filter(x => x.ativo).map(x =>
          `<option value="${esc(x.id)}" ${x.id === j.id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}
      </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="score-caixa">
      ${aro(fs.score, fs.faixa.cor)}
      <div style="flex:1;min-width:240px">
        <div style="font-size:25px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          ${avatar(j, 46)} ${esc(j.nome)} ${cintHTML(j, 20)}</div>
        ${campeao()?.id === j.id ? '<div class="tag t-ouro" style="margin:5px 0">👑 CINTURÃO ATUAL</div>' : ''}
        <div style="font-size:16px;font-weight:700;color:${fs.faixa.cor};margin:2px 0 12px">${esc(fs.faixa.nome)}</div>
        ${componentes(fs.componentes)}
        ${fs.confianca < 1 ? `<p style="font-size:12.5px;color:var(--texto-fraco);margin:8px 0 0">
          Com menos de 8 partidas o score fica puxado para 50 — é preciso jogar mais para ele valer de verdade.</p>` : ''}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="grade g3">
      <div class="kpi"><span>Posição no ladder</span><b>${noLadder ? '#' + noLadder.pos : '—'}</b></div>
      <div class="kpi"><span>Rating</span><b>${S.estado.rating[j.id]}</b></div>
