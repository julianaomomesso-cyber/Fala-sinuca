function tabelaConfra(g) {
  if (!g.rodadas?.length) return `<div class="aviso alerta"><div>${esc(g.aviso || 'Não deu para montar a tabela.')}</div></div>`;
  const todas = g.rodadas.flatMap(r => r.partidas);
  const ok = todas.filter(p => p.aprovada);
  const total = todas.length;
  const desafios = ok.filter(p => p.tipo === 'desafio').length;

  return `
    <div class="aviso ${ok.length ? 'bom' : 'alerta'}" style="margin-top:16px"><div>
      <b>${ok.length} de ${total} partidas aprovadas</b>, em ${g.rodadas.length} rodadas.
      ${desafios} valem posição no ladder, ${ok.length - desafios} são amistosos.
      A noite sobe da <b>#${Math.max(...g.rodadas[0].partidas.map(p => Math.max(p.desafiado.pos, p.desafiante.pos)))}</b>
      até <b>#1 × #2 pelo cinturão</b> na rodada ${g.rodadas.length}.<br>
      ${(() => {
        const c = {};
        ok.forEach(p => { for (const j of [p.desafiado, p.desafiante]) c[j.nome] = (c[j.nome] || 0) + 1; });
        return Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([n, v]) => `${esc(n)}: ${v}`).join(' · ');
      })()}<br>
      <span style="color:var(--texto-fraco)">Desmarque o que não vai rolar antes de abrir.</span>
    </div></div>
    <div class="linha" style="margin:10px 0 4px">
      <button class="btn mini" id="cf-copiar">Copiar tabela</button>
      <button class="btn mini" id="cf-marcar-tudo">Aprovar todas</button>
      <button class="btn mini p" id="cf-abrir-tudo">Abrir as aprovadas no app</button>
    </div>
    ${g.rodadas.map(r => `
      <div class="rodada${r.temCinturao ? ' rodada-cint' : ''}">
        <div class="rodada-topo">
          <b>Rodada ${r.n}</b>
          ${r.n === g.rodadas.length ? '<span class="tag t-ouro">🏆 decisão do cinturão</span>' : ''}
          ${r.folga.length ? `<span style="color:var(--texto-fraco);font-size:12.5px">folga: ${esc(r.folga.join(', '))}</span>` : ''}
          <button class="btn mini ok" data-abrir-rodada="${r.n}" style="margin-left:auto"
            ${r.partidas.some(p => p.aprovada) ? '' : 'disabled'}>Abrir no app</button>
        </div>
        ${r.partidas.map((p, i) => `
          <label class="confronto${p.aprovada ? '' : ' recusada'}">
            <input type="checkbox" class="cf-ok" data-r="${r.n}" data-i="${i}" ${p.aprovada ? 'checked' : ''}>
            ${p.duelo ? '<span class="tag t-ouro">🏆 cinturão</span>'
                      : p.peloCinturao ? '<span class="tag t-ouro">🏆</span>' : ''}
            <span class="tag ${p.tipo === 'desafio' ? 't-ouro' : 't-azul'}">${p.tipo}</span>
            <span class="cf-nomes"><b>#${p.desafiado.pos} ${esc(p.desafiado.nome)}</b>
              <span style="color:var(--texto-fraco)">×</span>
              <b>#${p.desafiante.pos} ${esc(p.desafiante.nome)}</b></span>
            <span class="cf-info">${p.odd_desafiado.toFixed(2)} / ${p.odd_desafiante.toFixed(2)}
              · dif ${p.dif} · ${p.jaJogaram ? p.jaJogaram + 'º confronto' : 'nunca se enfrentaram'}</span>
          </label>`).join('')}
      </div>`).join('')}`;
}

function textoConfra(g) {
  const linhas = ['🎱 FALA SINUCA — jogos da noite',
    'Começa embaixo e sobe até a decisão do cinturão.', ''];
  g.rodadas.forEach(r => {
    const lista = r.partidas.filter(p => p.aprovada);
    if (!lista.length) return;
    linhas.push(`*Rodada ${r.n}*` + (r.n === g.rodadas.length ? '  🏆 DECISÃO DO CINTURÃO' : ''));
    lista.forEach(p => linhas.push(
      `  Mesa ${p.mesa}: ${p.desafiado.nome} (#${p.desafiado.pos}) x ${p.desafiante.nome} (#${p.desafiante.pos})` +
      (p.tipo === 'desafio' ? '  — vale posição' : '  — amistoso') +
      (p.peloCinturao ? '  🏆' : '')));
    if (r.folga.length) linhas.push(`  _folga: ${r.folga.join(', ')}_`);
    linhas.push('');
  });
  linhas.push('Apostas abertas no app 🪙');
  return linhas.join('\n');
}

  });

function abrirDesafio(alvoId, tipo = 'desafio') {
  const alvo = jogDe(alvoId), eu = jogDe(S.eu);
  const amistoso = tipo === 'amistoso';
  if (!amistoso) {
    const v = desafioValido(S.ladder, S.eu, alvoId);
    if (!v.ok) return erro(v.motivo);
  }
  const minhaPos = S.ladder.find(x => x.id === S.eu)?.pos;
  const posAlvo = S.ladder.find(x => x.id === alvoId)?.pos;

  modal(amistoso ? 'Marcar amistoso' : 'Lançar desafio', `
    <p style="font-size:14.5px;line-height:1.6">
      Você (<b>#${minhaPos} ${esc(eu.nome)}</b>) vai
      ${amistoso ? 'jogar um amistoso contra' : 'desafiar'}
      <b>#${posAlvo} ${esc(alvo.nome)}</b>.</p>
    <div class="aviso ${amistoso ? 'info' : 'bom'}"><div>
      ${amistoso
        ? `O amistoso <b>vale rating</b> e entra no ranking, mas <b>ninguém muda de posição</b>
           no ladder — ganhando ou perdendo.<br><br>
           Serve para jogar com quem está fora do seu alcance, para revanche, ou só pelo rating.`
        : `Se você ganhar, <b>assume a posição dele</b>. Se perder, continua onde está —
           mas o rating troca pontos do mesmo jeito.`}
      <br><br>Enquanto o jogo estiver marcado, o pessoal pode apostar moedas em vocês dois.
    </div></div>
    <div class="linha" style="justify-content:flex-end">
      <button class="btn" data-x>Cancelar</button>
      <button class="btn p" data-ok>${amistoso ? 'Marcar amistoso' : 'Lançar desafio'}</button></div>`,
    (f, fechar) => {
      f.querySelector('[data-x]').onclick = fechar;
      f.querySelector('[data-ok]').onclick = async e => {
        e.target.disabled = true; e.target.textContent = 'Marcando…';
        try {
          await rpc('fs_criar_desafio',
            { p_desafiante: S.eu, p_desafiado: alvoId, p_tipo: tipo, p_obs: null });
          fechar();
          bom(amistoso ? 'Amistoso marcado! Agora é esperar as apostas.'
                       : 'Desafio lançado! Agora é esperar as apostas.');
          S.aba = 'jogos'; await recarregar();
        } catch (er) { erro(er.message); fechar(); }
      };
    });
}

async function cancelarDesafio(id) {
  if (!confirm('Cancelar este desafio?')) return;

    await rpc('fs_cancelar_desafio', { p_desafio: id, p_jogador: S.eu });

}

function abrirAposta(desafioId, emId, odd) {
  if (!S.eu) return erro('Escolha seu nome antes de apostar.');
  const saldo = saldoAtual(S.eu);
  const min = Number(cfg('aposta_minima', 10));
  const max = Math.min(Number(cfg('aposta_maxima', 5000)), saldo);
  if (saldo < min) return erro(`Saldo insuficiente. Você tem ${nf(saldo)} 🪙 e o mínimo é ${nf(min)}.`);

  modal(`Apostar em ${nomeDe(emId)}`, `
    <div class="linha" style="justify-content:space-between;margin-bottom:12px">
      <span style="color:var(--texto-fraco)">Seu saldo</span>
      <b style="color:var(--ouro-claro)">🪙 ${nf(saldo)}</b></div>
    <div class="linha" style="justify-content:space-between;margin-bottom:12px">
      <span style="color:var(--texto-fraco)">Odd travada agora</span>
      <b style="font-size:19px;color:var(--ouro-claro)">${odd.toFixed(2)}×</b></div>
    <label class="campo"><span>Quanto você vai apostar</span>
      <input type="number" id="ap-v" value="${Math.min(100, max)}" min="${min}" max="${max}" step="10"></label>
    <div class="linha" style="margin-bottom:12px">
      ${[50, 100, 250, 500].filter(v => v <= max).map(v =>
        `<button class="btn mini" data-fast="${v}">${v}</button>`).join('')}
      <button class="btn mini" data-fast="${max}">tudo (${nf(max)})</button>
    </div>
    <div class="aviso info" id="ap-prev"></div>
    <div class="linha" style="justify-content:flex-end">
      <button class="btn" data-x>Cancelar</button>
      <button class="btn p" data-ok>Confirmar aposta</button></div>`,
    (f, fechar) => {
      const inp = f.querySelector('#ap-v');
      const prev = () => {
        const v = Number(inp.value) || 0;
        f.querySelector('#ap-prev').innerHTML = `<div>Se <b>${esc(nomeDe(emId))}</b> vencer você recebe
          <b style="color:var(--verde)">${nf(Math.round(v * odd))} 🪙</b>
          (lucro de ${nf(Math.round(v * odd) - v)}). Se perder, você perde as ${nf(v)} moedas.
          Empate devolve tudo.</div>`;
      };
      inp.oninput = prev; prev();
      f.querySelectorAll('[data-fast]').forEach(b =>
        b.onclick = () => { inp.value = b.dataset.fast; prev(); });
      f.querySelector('[data-x]').onclick = fechar;
      f.querySelector('[data-ok]').onclick = async e => {
        const v = Number(inp.value);
        if (!v || v < min) return erro(`Mínimo de ${nf(min)} moedas.`);
        if (v > saldo) return erro('Você não tem esse saldo.');
        e.target.disabled = true; e.target.textContent = 'Apostando…';
        try {
          await rpc('fs_apostar', { p_apostador: S.eu, p_desafio: desafioId, p_em: emId, p_moedas: v });
          fechar(); bom(`Aposta de ${nf(v)} 🪙 registrada @ ${odd.toFixed(2)}×`);
          await recarregar();
        } catch (er) { erro(er.message); e.target.disabled = false; e.target.textContent = 'Confirmar aposta'; }
      };
    });
}

/** O próprio jogador lança quem venceu a partida dele. */
function lancarVencedor(desafioId, vencedorId) {
  const d = S.desafios.find(x => x.id === desafioId);
  if (!d) return;
  const outro = d.desafiado_id === S.eu ? d.desafiante_id : d.desafiado_id;
  const apostas = S.apostas.filter(a => a.desafio_id === desafioId && a.status === 'aberta');
  const texto = vencedorId === null ? 'Empate'
    : vencedorId === S.eu ? 'Você venceu' : `${nomeDe(outro)} venceu`;

  modal('Confirmar resultado', `
    <p style="font-size:15px;line-height:1.6">
      <b>${esc(nomeDe(d.desafiado_id))}</b> × <b>${esc(nomeDe(d.desafiante_id))}</b><br>
      Resultado: <b style="color:var(--ouro-claro);font-size:17px">${esc(texto)}</b></p>
    <div class="aviso alerta"><div>
      Assim que salvar, o rating${d.tipo === 'amistoso' ? '' : ' e o ladder'} se atualiza${d.tipo === 'amistoso' ? '' : 'm'}
      ${apostas.length ? `e as <b>${apostas.length} aposta(s)</b> na mesa são pagas` : ''}.
      Fica registrado que foi você quem lançou.<br><br>
      Errou? O admin consegue apagar a partida e devolver as moedas.
    </div></div>
    <div class="linha" style="justify-content:flex-end">
      <button class="btn" data-x>Voltar</button>
      <button class="btn p" data-ok>Confirmar</button></div>`,
    (f, fechar) => {
      f.querySelector('[data-x]').onclick = fechar;
      f.querySelector('[data-ok]').onclick = async e => {
        e.target.disabled = true; e.target.textContent = 'Salvando…';
        try {
          await rpc('fs_lancar_vencedor',
            { p_desafio: desafioId, p_jogador: S.eu, p_vencedor: vencedorId });
          fechar(); bom('Resultado lançado!'); await recarregar();
        } catch (er) { erro(er.message); e.target.disabled = false; e.target.textContent = 'Confirmar'; }
      };
    });
}

/** Reduz a imagem no próprio navegador antes de subir: 256px, JPEG. */
function prepararFoto(file) {
  return new Promise((ok, falha) => {
    if (!file.type.startsWith('image/')) return falha(new Error('Escolha um arquivo de imagem.'));
    if (file.size > 12 * 1024 * 1024) return falha(new Error('Imagem muito grande (máx. 12 MB).'));
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const L = 256;
      const lado = Math.min(img.width, img.height);          // recorta quadrado do centro
      const cv = document.createElement('canvas');
      cv.width = cv.height = L;
      const cx = cv.getContext('2d');
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, L, L);
      let q = 0.82, out = cv.toDataURL('image/jpeg', q);
      while (out.length > 180000 && q > 0.4) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
      ok(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('Não consegui abrir essa imagem.')); };
    img.src = url;
  });
}

      </div>
    </div>
    <input type="file" id="pv-file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif,image/*"
           style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
    <p style="font-size:12px;color:var(--texto-fraco);margin:4px 0 14px">
      A imagem é cortada em quadrado e reduzida aqui no seu aparelho antes de subir.</p>

    <div class="campo"><span class="rot">Emoji (aparece quando não tem foto)</span></div>
    <div class="emoji-grade" id="pv-emojis">
      ${EMOJIS.map(e => `<button type="button" data-e="${e}" class="${e === novoEmoji ? 'on' : ''}">${e}</button>`).join('')}
    </div>
    <label class="campo" style="margin-top:12px"><span>Ou digite o seu</span>
      <input type="text" id="pv-emoji-livre" maxlength="4" value="${esc(novoEmoji)}" style="width:90px;text-align:center;font-size:19px"></label>

    <div class="linha" style="justify-content:flex-end;margin-top:6px">
      <button class="btn" data-x>Cancelar</button>
      <button class="btn p" data-ok>Salvar</button></div>`,
    (f, fechar) => {
      const pv = f.querySelector('#pv-av');
      const desenhar = () => {
        const foto = novaFoto === null ? j.foto_url : (novaFoto || null);
        pv.innerHTML = foto
          ? `<img class="av" src="${esc(foto)}" alt="" style="width:96px;height:96px">`
          : `<span style="font-size:62px;line-height:1">${esc(novoEmoji)}</span>`;
      };
      desenhar();

      const inpFile = f.querySelector('#pv-file');
      f.querySelector('#pv-escolher').onclick = () => inpFile.click();
      inpFile.onchange = async e => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          novaFoto = await prepararFoto(file);
          f.querySelector('#pv-limpar').disabled = false;
          desenhar();
        } catch (er) { erro(er.message); }
      };
      f.querySelector('#pv-limpar').onclick = () => {
        novaFoto = ''; f.querySelector('#pv-limpar').disabled = true; desenhar();
      };
      f.querySelector('#pv-emojis').onclick = e => {
        const b = e.target.closest('[data-e]');
        if (!b) return;
        novoEmoji = b.dataset.e;
        f.querySelectorAll('#pv-emojis button').forEach(x => x.classList.toggle('on', x === b));
        f.querySelector('#pv-emoji-livre').value = novoEmoji;
        desenhar();
      };
      f.querySelector('#pv-emoji-livre').oninput = e => {
        novoEmoji = e.target.value || '🎱';
        f.querySelectorAll('#pv-emojis button').forEach(x => x.classList.remove('on'));
        desenhar();
      };
      f.querySelector('[data-x]').onclick = fechar;
      f.querySelector('[data-ok]').onclick = async e => {
        e.target.disabled = true; e.target.textContent = 'Salvando…';
        try {
          await rpc('fs_definir_perfil',
            { p_jogador: S.eu, p_emoji: novoEmoji, p_foto: novaFoto });
          fechar(); bom('Perfil atualizado.'); await recarregar();
        } catch (er) { erro(er.message); e.target.disabled = false; e.target.textContent = 'Salvar'; }
      };
    });
}

async function apagarJogo(id) {
  const g = S.jogos.find(x => x.id === id);
  if (!g) return;
  if (!confirm(`Apagar a partida ${nomeDe(g.desafiado_id)} × ${nomeDe(g.desafiante_id)} de ${dataBR(g.data)}?\n\n` +
    'As apostas ligadas a ela serão canceladas e as moedas devolvidas. ' +
    'O rating e o ladder são recalculados automaticamente.')) return;
  try {
    await rpc('fs_apagar_jogo', { p_jogo: id, p_motivo: 'Apagado pelo admin' });
    bom('Partida apagada e apostas estornadas.'); await recarregar();
  } catch (e) { erro(e.message); }
}

async function carregarAuditoria() {
  const { data, error } = await sb.from('auditoria')
    .select('*').order('criado_em', { ascending: false }).limit(60);
  if (error) return erro(error.message);
  S.auditoria = data; render();
}

function baixarBackup() {
  const dump = {
    exportado_em: new Date().toISOString(),
    jogadores: S.jogadores, jogos: S.jogos, desafios: S.desafios,
    apostas: S.apostas, carteira: S.carteira, config: S.config
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' }));
  a.download = `fala-sinuca-backup-${hojeISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  bom('Backup baixado.');
}

/* ------------------------------------------------------------ tempo real */
function ouvirMudancas() {
  sb.channel('fala-sinuca')
    .on('postgres_changes', { event: '*', schema: 'public' }, () => {
      clearTimeout(window.__fsT);
      window.__fsT = setTimeout(recarregar, 700);
    })
    .subscribe();
}

iniciar().then(() => { if (sb) ouvirMudancas(); });

</script>
</body>
</html>
